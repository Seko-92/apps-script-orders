function fit(text) { let s = 35; while (s > 20) { const L = layout(text, s, s * 0.09); if (L.width <= 505) return L; s -= 0.5; } return layout(text, s, s * 0.09); }

  o = o || {}; const a = o.alpha === undefined ? 1 : o.alpha; if (a <= 0.002) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.translate(q.x + q.w / 2 + (o.dx || 0), CY + (o.dy || 0));
  if (o.rot) ctx.rotate(o.rot * Math.PI / 180);
  if (o.sy !== undefined) ctx.scale(1, o.sy);
  const ch = o.ch || q.ch;
  if (ch === '★') {
    const r = L.size * 0.33; ctx.fillStyle = o.color || YEL; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const an = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(an) * rr, Math.sin(an) * rr); }
    ctx.closePath(); ctx.fill();
  } else {
    ctx.font = `500 ${L.size}px Oswald`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillStyle = o.color || INK; ctx.fillText(ch, 0, 1);
  }
  ctx.restore();
}
const line = (L, o) => L.g.forEach(q => glyph(L, q, o));

/* ── helpers ── */
const cl = (v) => Math.max(0, Math.min(1, v));
const eio = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eout = u => 1 - Math.pow(1 - u, 3);
const ein = u => u * u * u;
const sine = u => 0.5 - 0.5 * Math.cos(Math.PI * u);
const back = u => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
function hash(i, j) { let x = (i * 374761393 + j * 668265263) ^ 0x5bd1e995; x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
const stag = (i, n, u, spread) => cl((u - spread * (n > 1 ? i / (n - 1) : 0)) / (1 - spread));

function base(ro) {
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(document.getElementById('ebay'), 479.5, 80.5, 100, 40);
  roundel(ro);
  ctx.save(); ctx.beginPath(); ctx.rect(SX, 0, SW, SH); ctx.clip();
}
const end = () => ctx.restore();

/* ═══ the six moves: (u 0..1 across the change, A → B, t seconds into it) ═══ */
const MOVES = {
  /* 1 · TYPEWRITER — the line is deleted back to its first letter, the caret waits, the next line
     is typed with a human, uneven rhythm. The roundel stays still so the caret owns the moment. */
  typewriter(u, A, B, t) {
    base({});
    const caret = (x, on) => { if (!on) return; ctx.fillStyle = YEL; ctx.fillRect(Math.round(x) + 2, CY - A.size * 0.46, 2, A.size * 0.92); };
    const blink = Math.floor(t * 2.6) % 2 === 0;
    if (u < 0.36) {
      const n = Math.round(A.g.length * (1 - Math.pow(u / 0.36, 1.25)));
      for (let i = 0; i < n; i++) glyph(A, A.g[i]);
      caret(n ? A.g[n - 1].x + A.g[n - 1].w : A.left - 4, true);
    } else if (u < 0.46) {
      caret(B.left - 4, blink);
    } else {
      const k = (u - 0.46) / 0.46;
      let acc = 0, n = 0; const w = B.g.map((q, i) => 0.55 + hash(i, 7) * 0.9 + (q.ch === ' ' ? 0.8 : 0));
      const tot = w.reduce((s, x) => s + x, 0);
      for (let i = 0; i < B.g.length; i++) { acc += w[i] / tot; if (acc <= k) n = i + 1; }
      for (let i = 0; i < n; i++) glyph(B, B.g[i]);
      caret(n ? B.g[n - 1].x + B.g[n - 1].w : B.left - 4, k < 1 ? true : (u < 0.985 && blink));
    }
    end();
  },

  /* 2 · ODOMETER — every letter is a wheel that rolls up to the next one, left to right, with a
     small mechanical overshoot. The roundel turns like a bearing: ring one way, arc the other. */
  odometer(u, A, B) {
    const e = sine(u);
    base({ ringRot: e * 180, arcRot: -e * 180 });
    // the counter window: letters appear and vanish at its edges, like digits on a wheel
    ctx.beginPath(); ctx.rect(SX, CY - 23, SW, 46); ctx.clip();
    // staggered by POSITION, not index, so a new letter only rises where the old one has gone
    const pos = (q) => cl((q.x + q.w / 2 - 274) / 511);
    A.g.forEach(q => { const lu = cl((u - 0.5 * pos(q)) / 0.3); glyph(A, q, { dy: -ein(lu) * 44 }); });
    B.g.forEach(q => { const lu = cl((u - 0.5 * pos(q) - 0.2) / 0.3); if (lu > 0) glyph(B, q, { dy: (1 - back(lu)) * 44 }); });
    end();
  },

  /* 3 · DECODE — the line scrambles away right to left; the next one resolves out of part-number
     noise, each letter locking with a single yellow blink. The ring's arc sweeps once, like a scan. */
  decode(u, A, B, t) {
    base({ arcRot: sine(cl((u - 0.2) / 0.7)) * 360 });
    const pool = '0123456789ABCDEFHKLMNPRSTUVXYZ-/#';
    const rnd = (i, s) => pool[Math.floor(hash(i + s * 31, Math.floor(t * 18)) * pool.length)];
    A.g.forEach((q, i) => {
      if (q.ch === ' ') return;
      const tOut = 0.06 + 0.30 * (1 - i / (A.g.length - 1));
      if (u < tOut - 0.09) glyph(A, q);
      else if (u < tOut) glyph(A, q, { ch: rnd(i, 1), color: DIM });
    });
    B.g.forEach((q, i) => {
      if (q.ch === ' ') return;
      const tIn = 0.32 + 0.58 * (i / (B.g.length - 1));
      if (u >= tIn + 0.03) glyph(B, q);
      else if (u >= tIn) glyph(B, q, { color: YEL });
      else if (u >= tIn - 0.22) glyph(B, q, { ch: rnd(i, 2), color: DIM, alpha: 0.85 });
    });
    end();
  },

  /* 4 · CONVEYOR — a belt appears under the words; the line rides off to the left and the next one
     rides in from the right. The roundel turns with the belt, like the pulley driving it. */
  conveyor(u, A, B) {
    const e = eio(u), d = Math.max(A.right - SX + 14, SX + SW - B.left + 14);
    base({ ringRot: -e * d / (2 * Math.PI * 58) * 360, arcRot: -e * d / (2 * Math.PI * 46) * 360 });
    const belt = Math.min(1, u / 0.12, (1 - u) / 0.12);
    ctx.globalAlpha = belt; ctx.fillStyle = '#3d3b36'; ctx.fillRect(274, 57, 511, 1);
    ctx.fillStyle = '#6a675e';
    for (let x = 274 - ((e * d) % 16); x < 785; x += 16) if (x >= 274) ctx.fillRect(Math.round(x), 56, 2, 3);
    ctx.globalAlpha = 1;
    A.g.forEach(q => glyph(A, q, { dx: -e * d }));
    B.g.forEach(q => glyph(B, q, { dx: (1 - e) * d }));
    end();
  },

  /* 5 · ASSEMBLY — the line comes apart like a kit laid out on the bench; the next line's letters
     arrive from all over and seat into place. When the last one lands, the roundel stamps it. */
  assembly(u, A, B) {
    const p = (u - 0.86) / 0.14;
    base({ pulse: p >= 0 ? p : -1, scale: p >= 0 && p <= 1 ? 1 + 0.03 * Math.sin(Math.PI * p) : 1 });
    const scatter = (i, s) => ({ dx: (hash(i, s) - 0.5) * 84, dy: (hash(i, s + 1) - 0.5) * 50, rot: (hash(i, s + 2) - 0.5) * 60 });
    A.g.forEach((q, i) => { const lu = eio(cl((u - hash(i, 9) * 0.12) / 0.34)); const s = scatter(i, 3);
      glyph(A, q, { dx: s.dx * lu, dy: s.dy * lu, rot: s.rot * lu, alpha: 1 - lu }); });
    B.g.forEach((q, i) => { const lu = cl((u - 0.3 - hash(i, 11) * 0.34) / 0.3); if (lu <= 0) return; const e = eout(lu), s = scatter(i, 5);
      glyph(B, q, { dx: s.dx * (1 - e), dy: s.dy * (1 - e), rot: s.rot * (1 - e), alpha: Math.min(1, lu * 2.2) }); });
    const f = cl((u - 0.86) / 0.07), g = cl((u - 0.93) / 0.07);
    if (f > 0 && g < 1) { ctx.globalAlpha = 1 - g; ctx.fillStyle = YEL; const half = B.width / 2 * sine(f); ctx.fillRect(CX - half, 55, half * 2, 1.5); ctx.globalAlpha = 1; }
    end();
  },

  /* 6 · TITLE — cinematic tracking: the letters drift apart and fade, the next line arrives wide and
     settles tight. In the pause between, the roundel turns over once like a coin. */
  title(u, A, B) {
    const c = cl((u - 0.28) / 0.44), ang = sine(c) * Math.PI * 2;
    base({ scaleX: Math.max(0.04, Math.abs(Math.cos(ang))) });
    if (u < 0.48) { const e = ein(u / 0.48); line(layout(A.text, A.size, A.sp + 12 * e), { alpha: 1 - e }); }
    else { const e = eout((u - 0.48) / 0.52); line(layout(B.text, B.size, B.sp + 12 * (1 - e)), { alpha: e }); }
    end();
  }
};

const cache = {};
const L = (s) => cache[s] || (cache[s] = fit(s));
window.still = (text) => { base({}); line(L(text)); end(); return cv.toDataURL('image/png'); };
window.move = (name, a, b, u, t) => { MOVES[name](u, L(a), L(b), t); return cv.toDataURL('image/png'); };
Promise.all([document.fonts.load('500 35px Oswald'), new Promise(r => { const i = document.getElementById('ebay'); i.complete ? r() : i.onload = r; })])
  .then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
