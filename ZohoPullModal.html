<!DOCTYPE html>
<html>
<head>
  <base target="_top">
<!-- 2026-10-03: load the faces every rule below asks for (they were never loaded). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">

  <meta charset="utf-8">
  <style>
    /* =====================================================================
     * ZohoPullModal.html — Picker-driven review/apply for Zoho → DIRECT pulls
     *
     * Replaces the background _propagateToDirectRows auto-sync. Picker sees
     * every line's diff status, picks what to apply, server validates
     * against fresh state and commits atomically.
     *
     * Brand palette mirrors KitExpansionModal so visual language is
     * consistent across modal-based picker flows.
     * ===================================================================== */

    :root {
      --ink:           #1a1a1a;
      --ink-mute:      #5f5f5f;
      --paper:         #ffffff;
      --paper-warm:    #fff8e7;
      --paper-tint:    #fffbf0;
      --brand-yellow:        #ffd400;
      --brand-yellow-soft:   #fff4b0;
      --brand-yellow-rim:    #ffb800;
      --green-ink:     #1b5e20;
      --green-bg:      #e8f5e9;
      --green-rim:     #66bb6a;
      --amber-ink:     #6b4500;
      --amber-bg:      #fff4e0;
      --amber-rim:     #f57c00;
      --red-ink:       #b71c1c;
      --red-bg:        #ffe5e5;
      --red-rim:       #e57373;
      --slate-ink:     #455a64;
      --slate-bg:      #eceff1;
      --slate-rim:     #90a4ae;
      --missing:       #d32f2f;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 13px;
      color: var(--ink);
      background: var(--paper-warm);
      overflow: hidden;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* ----- HEADER ----- */
    .hdr {
      flex: 0 0 auto;
      padding: 12px 16px 8px;
      background: var(--ink);
      color: var(--paper);
      border-bottom: 3px solid var(--brand-yellow);
    }
    .hdr-row1 {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hdr-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hdr-so {
      font-family: 'Roboto Mono', monospace;
      color: var(--brand-yellow);
      font-size: 17px;
      font-weight: 600;
    }
    .hdr-customer {
      color: #d4d4d4;
      font-size: 14px;
    }
    .hdr-total {
      color: var(--brand-yellow);
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      margin-left: auto;
    }
    .hdr-row2 {
      margin-top: 6px;
      font-size: 12px;
      color: #c0c0c0;
      letter-spacing: 0.02em;
    }
    .hdr-row2 strong { color: var(--brand-yellow); font-weight: 600; }
    .hdr-row2 .chip-summary {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 4px;
      border-radius: 3px;
      background: rgba(255, 212, 0, 0.15);
      border: 1px solid rgba(255, 212, 0, 0.4);
      color: var(--brand-yellow);
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ----- BODY ----- */
    .body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 12px 14px;
    }

    /* ----- LINE CARD ----- */
    .line {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 9px 12px;
      margin-bottom: 7px;
      background: var(--paper);
      border-radius: 4px;
      border-left: 3px solid var(--slate-rim);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: opacity 160ms ease, background 160ms ease;
    }
    .line.new       { border-left-color: var(--green-rim);  background: var(--green-bg); }
    .line.qty       { border-left-color: var(--amber-rim);  background: var(--amber-bg); }
    .line.removed   { border-left-color: var(--red-rim);    background: var(--red-bg); }
    .line.unchanged { border-left-color: var(--slate-rim);  background: var(--slate-bg); opacity: 0.7; }
    .line.unchecked { opacity: 0.55; }

    .line-cb {
      grid-column: 1;
      grid-row: 1 / span 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 2px;
    }
    .line-cb input[type=checkbox] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--brand-yellow-rim);
    }
    .line-cb .locked {
      font-size: 11px;
      color: var(--ink-mute);
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.06em;
      transform: rotate(-90deg);
      transform-origin: center;
      white-space: nowrap;
    }

    .line-main {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .line-row1 {
      display: flex;
      gap: 9px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    .line-sku {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--ink);
    }
    .line-name {
      color: var(--ink-mute);
      font-size: 12.5px;
    }
    .line-row2 {
      font-family: 'Roboto Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-mute);
    }
    .line-row2 .qty-spec  { font-weight: 700; color: var(--ink); }
    .line-row2 .qty-delta { color: var(--amber-ink); font-weight: 700; }
    .line-row2 .loc       { padding: 0 4px; }
    .line-row2 .loc.missing { color: var(--missing); font-weight: 700; }
    .line-row2 .hand-low  { color: var(--missing); font-weight: 700; }

    .line-chips {
      grid-column: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .chip {
      padding: 1px 7px;
      border-radius: 3px;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .chip.new       { background: #c8e6c9; color: var(--green-ink); border: 1px solid var(--green-rim); }
    .chip.qty       { background: var(--brand-yellow-soft); color: var(--amber-ink); border: 1px solid var(--amber-rim); }
    .chip.removed   { background: var(--red-bg); color: var(--red-ink); border: 1px solid var(--red-rim); }
    .chip.unchanged { background: var(--slate-bg); color: var(--slate-ink); border: 1px solid var(--slate-rim); }
    .chip.kit       { background: #ede7f6; color: #4527a0; border: 1px solid #9575cd; }
    .chip.missing   { background: #ffebee; color: var(--missing); border: 1px solid #ef9a9a; }

    /* ----- ACTION TOGGLE (sub-action for qty_changed and removed) ----- */
    .line-actions {
      grid-column: 2 / span 2;
      grid-row: 3;
      margin-top: 5px;
      padding: 4px 0 0;
      border-top: 1px dashed rgba(0,0,0,0.10);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .action-opt {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11.5px;
      color: var(--ink-mute);
      transition: background 120ms ease, color 120ms ease;
    }
    .action-opt input[type=radio] {
      accent-color: var(--brand-yellow-rim);
      cursor: pointer;
    }
    .action-opt:hover { background: rgba(0,0,0,0.04); }
    .action-opt.chosen {
      background: rgba(255, 212, 0, 0.18);
      color: var(--ink);
      font-weight: 600;
    }
    .action-opt-hint {
      color: var(--ink-mute);
      font-size: 10.5px;
      font-style: italic;
      margin-left: 4px;
    }

    /* ----- DIRECT ROW DETAIL (for qty_changed and removed only) ----- */
    .line-direct-rows {
      grid-column: 2 / span 2;
      grid-row: 4;
      margin-top: 3px;
      font-family: 'Roboto Mono', monospace;
      font-size: 10.5px;
      color: var(--ink-mute);
      letter-spacing: 0.02em;
    }
    /* ----- PER-LINE NOTE (only on lines that insert a row) ----- */
    .line-note {
      grid-column: 2 / span 2;
      grid-row: 5;
      margin-top: 5px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .line-note .zoho-note {
      font-family: 'Roboto', sans-serif;
      font-size: 11.5px;
      font-style: italic;
      color: #8a7434;
      cursor: pointer;
    }
    .line-note .zoho-note .label {
      font-family: 'Oswald', sans-serif;
      font-style: normal;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-right: 4px;
    }
    .line-note .zoho-note:hover { text-decoration: underline; }
    .line-note input {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #e0d6b8;
      border-radius: 4px;
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      background: #fffdf6;
      color: #1d1d1b;
    }
    .line-note input:focus { outline: none; border-color: #cdba7f; }
    .line.unchecked .line-note { display: none; }
    .line.new .line-note { grid-row: 2; margin-top: 0; }   /* no action/existing rows above it */

    .line-direct-rows .label {
      font-family: 'Oswald', sans-serif;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--amber-ink);
      margin-right: 4px;
    }

    /* ----- FOOTER ----- */
    .ftr {
      flex: 0 0 auto;
      padding: 10px 14px;
      border-top: 2px solid var(--brand-yellow);
      background: var(--paper-tint);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ftr-summary {
      flex: 1;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      color: var(--ink);
    }
    .ftr-summary.warn {
      color: var(--amber-ink);
      font-weight: 600;
    }
    .ftr-btns {
      display: flex;
      gap: 8px;
    }
    .btn-cancel {
      background: transparent;
      color: var(--ink-mute);
      border: 1px solid #c0c0c0;
      padding: 7px 14px;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: all 130ms ease;
    }
    .btn-cancel:hover:not(:disabled) {
      background: rgba(0,0,0,0.05);
      color: var(--ink);
    }
    .btn-apply {
      background: var(--brand-yellow);
      color: var(--ink);
      border: 1px solid var(--brand-yellow-rim);
      padding: 7px 16px;
      font-family: 'Oswald', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: all 130ms ease;
    }
    .btn-apply:hover:not(:disabled) {
      background: var(--brand-yellow-rim);
      box-shadow: 0 3px 10px rgba(255, 212, 0, 0.5);
    }
    .btn-apply:disabled,
    .btn-cancel:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ----- STATUS BAR (transient toasts) ----- */
    .status {
      position: fixed;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--brand-yellow);
      padding: 8px 16px;
      border-radius: 4px;
      font-family: 'Roboto Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .status.shown {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .status.error {
      background: var(--red-ink);
      color: #fff;
    }

    /* ----- LOADING OVERLAY (during applyZohoPullSelection) ----- */
    /* Covers the modal while DIRECT rows are written — replaces the
       greyed-buttons-only feedback that read as a frozen window. */
    /* Frosted veil + dual-ring brand spinner — matches Kit Expansion (2026-07-31). */
    .zp-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(24, 23, 21, 0.52);
      -webkit-backdrop-filter: blur(3.5px) saturate(0.9);
      backdrop-filter: blur(3.5px) saturate(0.9);
      border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      opacity: 0; pointer-events: none; transition: opacity 180ms;
    }
    .zp-overlay.shown { opacity: 1; pointer-events: all; }
    .zp-spinner { position: relative; width: 60px; height: 60px; }
    .zp-spinner::before, .zp-spinner::after {
      content: ''; position: absolute; border-radius: 50%; border: 3px solid transparent;
    }
    .zp-spinner::before {
      inset: 0; border-top-color: var(--brand-yellow); border-right-color: rgba(255,212,0,0.30);
      animation: zp-spin 0.85s linear infinite;
    }
    .zp-spinner::after {
      inset: 12px; border-bottom-color: rgba(255,212,0,0.55);
      animation: zp-spin 1.3s linear infinite reverse;
    }
    .zp-spinner-dot {
      position: absolute; inset: 24px; border-radius: 50%; background: var(--brand-yellow);
      box-shadow: 0 0 10px rgba(255,212,0,0.55); animation: zp-pulse 1.15s ease-in-out infinite;
    }
    @keyframes zp-spin { to { transform: rotate(360deg); } }
    @keyframes zp-pulse { 0%,100%{ transform: scale(0.65); opacity:0.5; } 50%{ transform: scale(1); opacity:1; } }
    .zp-overlay-msg {
      font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-yellow);
      text-align: center; padding: 0 24px;
    }
    .zp-overlay-msg::after { content: ''; animation: zp-dots 1.5s steps(1, end) infinite; }
    @keyframes zp-dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';} }
    .zp-overlay-sub { font-family: 'Roboto', sans-serif; font-size: 12px; color: #d0d0d0; margin-top: -8px; text-align: center; padding: 0 24px; }

    /* ----- DONE SCREEN (after Apply succeeds) ----- */
    .done {
      padding: 30px 24px;
      text-align: center;
    }
    .done-icon {
      font-size: 38px;
      color: var(--green-ink);
      margin-bottom: 8px;
    }
    .done-title {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .done-subtitle {
      color: var(--ink-mute);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .done-result {
      background: var(--paper);
      padding: 10px 14px;
      border-radius: 4px;
      border-left: 3px solid var(--green-rim);
      display: inline-block;
      font-family: 'Roboto Mono', monospace;
      font-size: 12.5px;
      color: var(--ink);
      text-align: left;
    }
    .done-result-row {
      padding: 2px 0;
    }
  
/* ═══════════════════════════════════════════════════════════════════════════
   ONE SURFACE (2026-10-03) — the owner's call after a review round.
   Google draws a white frame, a title and a close button around every modal,
   and none of it can be styled. A cream page with a full-bleed black band
   inside that frame read as "a sticker on white paper". So the page now
   CONTINUES the frame: white ground, Google's title is the window's only
   title (ours is hidden), no full-bleed bands. Panels float on soft layered
   shadows; inputs are pressed in; primary buttons are raised yellow keys.
   Black and yellow stay where they carry meaning, as rounded objects, never
   as bands. Same rule in all seven windows, so they read as one family.
   Appended LAST so it overrides without editing the rules above.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --os-ease: cubic-bezier(.37,0,.63,1);
  --os-raise: 0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(70,52,0,.06),
              0 5px 12px rgba(70,52,0,.07), 0 18px 36px -16px rgba(70,52,0,.22);
  --os-lift: 0 1px 2px rgba(70,52,0,.07), 0 4px 10px rgba(70,52,0,.07);
  --os-press: inset 0 2px 3px rgba(70,52,0,.10);
  --os-key: inset 0 1px 0 rgba(255,255,255,.7), 0 3px 0 #b89500, 0 7px 16px rgba(184,149,0,.30);
  --os-key-hover: inset 0 1px 0 rgba(255,255,255,.7), 0 4px 0 #b89500, 0 10px 20px rgba(184,149,0,.32);
  --os-key-down: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 #b89500, 0 2px 6px rgba(184,149,0,.28);
  --os-yellow: linear-gradient(180deg,#ffe45c 0%,#ffcf00 100%);
  --os-panel: linear-gradient(180deg,#fffaee,#fff6e2);
  --os-rim: rgba(150,115,20,.16);
}
html, body { background: #fff !important; }
@keyframes os-rise { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.hdr{ background:none !important; color:#1d1d1b !important; border-bottom:none !important; padding:0 12px 10px !important; }
.hdr-title{ display:none !important; }
.hdr-so{ color:#1d1d1b !important; background:#ffd400; padding:1px 9px; border-radius:7px; box-shadow: 0 2px 0 #c29f00; }
.hdr-customer{ color:#5f5f5f !important; }
.hdr-total{ color:#1d1d1b !important; font-weight:700; }
.hdr-row2{ color:#6e6450 !important; }
.hdr-row2 strong{ color:#1d1d1b !important; }
.hdr-row2 .chip-summary{ background:#fff4b0 !important; border:1px solid #e6cf5c !important; color:#5c4600 !important; border-radius:999px !important; }
.body{ background:#fff !important; padding-left:12px !important; padding-right:12px !important; }
.line{ border-radius:12px !important; box-shadow: var(--os-lift) !important; animation: os-rise 380ms var(--os-ease) both; }
.wrap > div[style*="fff8e7"]{ background:#fff !important; padding-left:12px !important; padding-right:12px !important; }
.ftr{ background: #fff !important; border-top: 1px solid var(--os-rim) !important;
  box-shadow: 0 -8px 16px -10px rgba(70,52,0,.16) !important; }
.btn-apply{ background: var(--os-yellow) !important; border: none !important; border-radius: 9px !important;
  box-shadow: var(--os-key) !important; transition: transform 120ms var(--os-ease), box-shadow 120ms var(--os-ease), filter 200ms var(--os-ease) !important; }
.btn-apply:hover:not(:disabled){ transform: translateY(-1px); box-shadow: var(--os-key-hover) !important; filter: brightness(1.03); }
.btn-apply:active:not(:disabled){ transform: translateY(3px); box-shadow: var(--os-key-down) !important; }
.btn-cancel{ background: #fff !important; border: 1px solid var(--os-rim) !important; border-radius: 9px !important;
  box-shadow: var(--os-lift) !important; transition: transform 120ms var(--os-ease) !important; }
.btn-cancel:active:not(:disabled){ transform: translateY(1px); box-shadow: none !important; }
#zpNote{ background: #fffdf8 !important; color: #1d1d1b !important; border: 1px solid #dccb9b !important;
  border-radius: 9px !important; box-shadow: var(--os-press) !important; }
#zpNote:focus{ outline: none; border-color: #e3b900 !important;
  box-shadow: var(--os-press), 0 0 0 3px rgba(255,212,0,.32) !important; }

/* ═══ IN-PLACE LOADING (2026-10-05) ═══════════════════════════════════════════
   The old loading screen covered the whole window with a blurred veil and a
   spinner card. Reported from use: "still feels like a sticker" — anything laid
   OVER the content reads as pasted on, however well it is drawn. So the veil is
   gone and the work shows where it happens: a thin bar sweeps the top edge, the
   button you pressed spins, a one-line message sits at the top of the area the
   result will land in, and that area fades slightly while it works.
   ⚠ The window's own show/hide calls are UNCHANGED — a small observer watches
   the old overlay element's class and drives this instead, so no code path that
   opens or closes the loader could be missed. Same block in every window. */
#zpOverlay{ display:none !important; }
.wk-bar{ position:fixed; top:0; left:0; right:0; height:3px; z-index:9999; overflow:hidden;
  opacity:0; transition:opacity 180ms ease; pointer-events:none; }
.wk-bar::before{ content:''; position:absolute; top:0; bottom:0; width:38%; left:-38%;
  background:linear-gradient(90deg, rgba(255,207,0,0), #ffcf00 40%, #ffe45c 60%, rgba(255,207,0,0));
  animation: wk-sweep 1.15s cubic-bezier(.37,0,.63,1) infinite; }
@keyframes wk-sweep{ to{ left:100%; } }
body.wk-on .wk-bar{ opacity:1; }
.wk-line{ display:flex; align-items:center; gap:9px; padding:9px 4px 10px; margin:0 0 6px;
  font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
  color:#6b5a2a; border-bottom:1px dashed #e6d9b3; animation: wk-in 220ms ease both; }
.wk-line::before{ content:''; width:12px; height:12px; flex-shrink:0; border-radius:50%;
  border:2px solid #f1e3a8; border-top-color:#e3b900; animation: wk-spin .7s linear infinite; }
.wk-line .wk-sub{ font-family:'Roboto',sans-serif; text-transform:none; letter-spacing:0; font-size:12px; color:#8a7a4a; }
@keyframes wk-spin{ to{ transform:rotate(360deg); } }
@keyframes wk-in{ from{ opacity:0; transform:translateY(-3px); } to{ opacity:1; transform:none; } }
body.wk-on #bodyEl > :not(.wk-line){ pointer-events:none; filter: opacity(.42) saturate(.6);
  transition: filter 220ms ease; }  /* filter, not opacity: os-rise holds opacity via fill-mode */
button.wk-btn{ position:relative; }
button.wk-btn::after{ content:''; display:inline-block; width:10px; height:10px; margin-left:8px; vertical-align:-1px;
  border-radius:50%; border:2px solid rgba(29,29,27,.25); border-top-color:#1d1d1b; animation: wk-spin .7s linear infinite; }
@media (prefers-reduced-motion: reduce){ .wk-bar::before, .wk-line::before, button.wk-btn::after{ animation-duration: 2.4s; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hdr" id="hdrEl">
      <!-- populated by renderHeader() -->
    </div>

    <div class="body" id="bodyEl">
      <!-- populated by renderLines() -->
    </div>

    <!-- Optional operator note — written to the pulled rows' NOTE cell so it
         travels with the order to the picker (only lands on inserted rows). -->
    <div style="padding:8px 14px 0; background:#fff8e7;">
      <input type="text" id="zpNote" maxlength="200" autocomplete="off"
        placeholder="Optional note for this order — rides to the picker (e.g. hold for payment · needs it Friday · call before shipping)"
        style="width:100%; padding:7px 10px; border:1px solid #cdba7f; border-radius:6px; font-family:'Roboto',sans-serif; font-size:13px; background:#fffdf6; color:#1d1d1b;" />
    </div>

    <div class="ftr" id="ftrEl">
      <span class="ftr-summary" id="summaryEl">Loading…</span>
      <div class="ftr-btns">
        <button class="btn-cancel" id="btnCancel" onclick="onCancel()">Cancel</button>
        <button class="btn-apply"  id="btnApply"  onclick="onApply()">Apply</button>
      </div>
    </div>

    <div class="status" id="statusBar"></div>
  </div>

  <!-- LOADING OVERLAY — shown while applyZohoPullSelection writes DIRECT rows -->
  <div class="zp-overlay" id="zpOverlay">
    <div class="zp-spinner"><span class="zp-spinner-dot"></span></div>
    <div class="zp-overlay-msg" id="zpOverlayMsg">Applying changes</div>
    <div class="zp-overlay-sub">Writing rows to the sheet — please don't close this window</div>
  </div>

  <script>
    // Server-injected payload. Force-unescaped scriptlet used below because
    // diffJson is a JSON string that would be corrupted by HTML escaping of
    // quotes. Pre-substituted forward-slash escapes server-side to defend
    // against any value containing a literal closing-script-tag substring.
    // (Documenting the scriptlet syntax in a comment here would itself
    // trigger Apps Script's template engine — see CLAUDE.md Gotcha #2.)
    var DIFF = <?!= diffJson ?>;

    // Per-line picker state: keyed by sku, holds { checked: bool, action: string }
    // - For "new": action is fixed "insert"
    // - For "qty_changed": action is "insert_delta" (default) or "flag_existing"
    // - For "removed": action is "flag_removed" (default) or "cancel_removed"
    // - For "unchanged": locked, not in state
    var state = {};

    // ------------------------------------------------------------------
    // INIT
    // ------------------------------------------------------------------
    initState();
    renderHeader();
    renderLines();
    updateSummary();

    function initState() {
      DIFF.lines.forEach(function(line) {
        if (line.status === "unchanged") return;  // locked, no state needed
        var defaultAction;
        switch (line.status) {
          case "new":         defaultAction = "insert";         break;
          case "qty_changed": defaultAction = "insert_delta";   break;
          case "removed":     defaultAction = "flag_removed";   break;
        }
        state[line.sku] = {
          checked: true,                   // per-lock: NEW lines default checked
          action:  defaultAction,
          note:    ''                      // this line's own note → rides on the inserted row
        };
      });
    }

    // ------------------------------------------------------------------
    // HEADER
    // ------------------------------------------------------------------
    function renderHeader() {
      var hdr = document.getElementById('hdrEl');
      var s = DIFF.summary;
      var bits = [];
      if (s.new > 0)         bits.push('<span class="chip-summary">' + s.new + ' new</span>');
      if (s.qtyChanged > 0)  bits.push('<span class="chip-summary">' + s.qtyChanged + ' qty changed</span>');
      if (s.removed > 0)     bits.push('<span class="chip-summary">' + s.removed + ' removed</span>');
      if (s.unchanged > 0)   bits.push('<span class="chip-summary">' + s.unchanged + ' unchanged</span>');

      var since = DIFF.pulledAt
        ? 'since pulled ' + esc(DIFF.pulledAt)
        : (DIFF.pendingLastUpdated ? 'updated ' + esc(DIFF.pendingLastUpdated) : '');

      hdr.innerHTML =
          '<div class="hdr-row1">'
        +   '<span class="hdr-title">Pull from Zoho</span>'
        +   '<span class="hdr-so">' + esc(DIFF.soNumber) + '</span>'
        + (DIFF.invoiceNumber
            ? '<span class="hdr-customer">· ' + esc(DIFF.invoiceNumber) + '</span>'
            : '')
        +   '<span class="hdr-customer">· ' + esc(DIFF.customerName || '—') + '</span>'
        + (DIFF.totalFormatted
            ? '<span class="hdr-total">' + esc(DIFF.totalFormatted) + '</span>'
            : '')
        + '</div>'
        + '<div class="hdr-row2">'
        +   bits.join(' ')
        + (since ? '  <span style="color:#888;">· ' + esc(since) + '</span>' : '')
        + '</div>';
    }

    // ------------------------------------------------------------------
    // LINE LIST
    // ------------------------------------------------------------------
    function renderLines() {
      var body = document.getElementById('bodyEl');
      var html = '';
      DIFF.lines.forEach(function(line) {
        html += renderLine(line);
      });
      body.innerHTML = html;
    }

    function renderLine(line) {
      var sku = line.sku;
      var s = state[sku];

      // Class + chips per status
      var classes = ['line', statusClass(line.status)];
      if (s && !s.checked) classes.push('unchecked');

      var checkbox;
      if (line.status === "unchanged") {
        checkbox = '<span class="locked">LOCKED</span>';
      } else {
        var checked = s.checked ? 'checked' : '';
        checkbox = '<input type="checkbox" ' + checked + ' '
                 + 'onchange="onToggleLine(\'' + escAttr(sku) + '\')">';
      }

      // Row 1: SKU + name
      var nameDisplay = line.name ? esc(line.name) : '';

      // Row 2: per-status meta
      var row2 = renderLineMeta(line);

      // Chips
      var chips = renderLineChips(line);

      // Action toggle (only for qty_changed and removed)
      var actions = '';
      if (line.status === "qty_changed" || line.status === "removed") {
        actions = renderLineActions(line);
      }

      // Existing DIRECT rows (only for qty_changed and removed)
      var directRowsHtml = '';
      if ((line.status === "qty_changed" || line.status === "removed") && line.directRows && line.directRows.length) {
        var rowBits = line.directRows.map(function(rr) {
          return 'row ' + rr.row + ' (' + esc(rr.status) + ', qty ' + rr.qty + ')';
        }).join(' · ');
        directRowsHtml =
            '<div class="line-direct-rows">'
          +   '<span class="label">existing:</span>'
          +   rowBits
          + '</div>';
      }

      // Per-line note — only where Apply INSERTS a row (new line, or a delta row);
      // a flag or a cancel writes no row, so a note there would go nowhere.
      var noteHtml = '';
      if (line.status === "new" || line.status === "qty_changed") {
        var zn = line.zohoNote
          ? '<div class="zoho-note" title="Click to use it as this line\'s note" '
            + 'onclick="useZohoNote(\'' + escAttr(sku) + '\')">'
            + '<span class="label">Zoho note</span>' + esc(line.zohoNote) + '</div>'
          : '';
        noteHtml = '<div class="line-note">' + zn
          + '<input type="text" maxlength="150" autocomplete="off" '
          +   'id="note-' + escAttr(sku) + '" value="' + escAttr(s.note) + '" '
          +   'placeholder="Note for this item only (optional)" '
          +   'oninput="onLineNote(\'' + escAttr(sku) + '\', this.value)">'
          + '</div>';
      }

      return ''
        + '<div class="' + classes.join(' ') + '" id="line-' + escAttr(sku) + '">'
        +   '<div class="line-cb">' + checkbox + '</div>'
        +   '<div class="line-main">'
        +     '<div class="line-row1">'
        +       '<span class="line-sku">' + esc(sku) + '</span>'
        +       '<span class="line-name">' + nameDisplay + '</span>'
        +     '</div>'
        +     '<div class="line-row2">' + row2 + '</div>'
        +   '</div>'
        +   '<div class="line-chips">' + chips + '</div>'
        +   actions
        +   directRowsHtml
        +   noteHtml
        + '</div>';
    }

    function renderLineMeta(line) {
      // Per status, show the most useful info compactly.
      var locClass = line.missing ? 'loc missing' : 'loc';
      var locText = '<span class="' + locClass + '">' + esc(line.location) + '</span>';

      var hand = '';
      if (line.available != null) {
        var lowClass = (line.available <= 5) ? 'hand-low' : '';
        hand = '<span class="' + lowClass + '">HAND ' + line.available + '</span>';
      }

      switch (line.status) {
        case "new":
          return '<span class="qty-spec">Qty ' + line.zohoQty + '</span> · '
               + locText + (hand ? ' · ' + hand : '');
        case "qty_changed":
          var deltaStr = (line.delta > 0 ? '+' : '') + line.delta;
          return 'Was ' + line.directQty + ', now <span class="qty-spec">' + line.zohoQty + '</span> '
               + '<span class="qty-delta">(' + deltaStr + ')</span> · '
               + locText + (hand ? ' · ' + hand : '');
        case "removed":
          return '<span class="qty-spec">Was on DIRECT · qty ' + line.directQty + '</span> · '
               + 'no longer in Zoho';
        case "unchanged":
          return '<span class="qty-spec">Qty ' + line.zohoQty + '</span> · '
               + locText + (hand ? ' · ' + hand : '')
               + '  · already in DIRECT';
      }
      return '';
    }

    function renderLineChips(line) {
      var chips = [];
      switch (line.status) {
        case "new":         chips.push('<span class="chip new">NEW</span>'); break;
        case "qty_changed": chips.push('<span class="chip qty">QTY CHANGED</span>'); break;
        case "removed":     chips.push('<span class="chip removed">REMOVED</span>'); break;
        case "unchanged":   chips.push('<span class="chip unchanged">UNCHANGED</span>'); break;
      }
      if (line.missing && line.status !== "unchanged") {
        chips.push('<span class="chip missing">NOT IN MI</span>');
      }
      return chips.join('');
    }

    function renderLineActions(line) {
      var s = state[line.sku];
      var sku = line.sku;
      var opts;
      if (line.status === "qty_changed") {
        opts = [
          { val: "insert_delta",  label: "Insert delta row",
            hint: "Adds a new row for the +" + line.delta + " — picker walks the extra units separately." },
          { val: "flag_existing", label: "Flag existing rows",
            hint: "Annotate existing row(s) with ⚠ ZOHO QTY: X → Y. No new row." }
        ];
      } else {
        opts = [
          { val: "flag_removed",  label: "Flag (strikethrough)",
            hint: "Strikethrough + ⚠ REMOVED IN ZOHO. Row stays; picker decides physically." },
          { val: "cancel_removed", label: "Mark CANCELED",
            hint: "Flip row status to CANCELED. Use when you've confirmed the line is dead." }
        ];
      }
      var html = '<div class="line-actions">';
      opts.forEach(function(opt) {
        var chosen = (s.action === opt.val) ? 'chosen' : '';
        var checkedAttr = (s.action === opt.val) ? 'checked' : '';
        html += ''
          + '<label class="action-opt ' + chosen + '" title="' + escAttr(opt.hint) + '">'
          +   '<input type="radio" name="action-' + escAttr(sku) + '" '
          +     'value="' + escAttr(opt.val) + '" ' + checkedAttr + ' '
          +     'onchange="onActionChange(\'' + escAttr(sku) + '\', \'' + escAttr(opt.val) + '\')">'
          +   esc(opt.label)
          + '</label>';
      });
      html += '</div>';
      return html;
    }

    function statusClass(status) {
      return {
        "new":         "new",
        "qty_changed": "qty",
        "removed":     "removed",
        "unchanged":   "unchanged"
      }[status] || "";
    }

    // ------------------------------------------------------------------
    // EVENT HANDLERS
    // ------------------------------------------------------------------
    function onToggleLine(sku) {
      if (!state[sku]) return;
      state[sku].checked = !state[sku].checked;
      // Refresh just this line so the unchecked dim state updates
      var lineEl = document.getElementById('line-' + sku);
      if (lineEl) {
        if (state[sku].checked) lineEl.classList.remove('unchecked');
        else                    lineEl.classList.add('unchecked');
      }
      updateSummary();
    }

    function onActionChange(sku, action) {
      if (!state[sku]) return;
      state[sku].action = action;
      // Re-render the actions row of this one line so .chosen highlights update
      var lineEl = document.getElementById('line-' + sku);
      if (lineEl) {
        var line = findLine(sku);
        if (line) {
          var actionsEl = lineEl.querySelector('.line-actions');
          if (actionsEl) {
            // Surgical re-render: replace just the inner HTML of .line-actions
            var temp = document.createElement('div');
            temp.innerHTML = renderLineActions(line);
            actionsEl.innerHTML = temp.firstChild.innerHTML;
          }
        }
      }
    }

    function onLineNote(sku, val) {
      if (state[sku]) state[sku].note = val;
    }

    function useZohoNote(sku) {
      var line = findLine(sku);
      var el = document.getElementById('note-' + sku);
      if (!line || !el || !state[sku]) return;
      el.value = line.zohoNote.slice(0, 150);
      state[sku].note = el.value;
      el.focus();
    }

    function findLine(sku) {
      for (var i = 0; i < DIFF.lines.length; i++) {
        if (DIFF.lines[i].sku === sku) return DIFF.lines[i];
      }
      return null;
    }

    function updateSummary() {
      var n = 0;
      Object.keys(state).forEach(function(sku) {
        if (state[sku].checked) n++;
      });
      var total = DIFF.summary.totalLines - DIFF.summary.unchanged;
      var msg = n + ' of ' + total + ' selected to apply';
      var el = document.getElementById('summaryEl');
      el.textContent = msg;
      el.className = (n === 0) ? 'ftr-summary warn' : 'ftr-summary';
      document.getElementById('btnApply').disabled = (n === 0);
    }

    // ------------------------------------------------------------------
    // APPLY / CANCEL
    // ------------------------------------------------------------------
    var busy = false;
    function onApply() {
      if (busy) return;

      // Collect selections from state
      var selections = [];
      Object.keys(state).forEach(function(sku) {
        if (state[sku].checked) {
          var sel = { sku: sku, action: state[sku].action };
          var ln = (state[sku].note || '').trim();
          if (ln) sel.note = ln;
          selections.push(sel);
        }
      });
      if (selections.length === 0) {
        showStatus('Nothing selected', true);
        return;
      }

      // Soft confirm if any cancel_removed actions present — flipping rows
      // to CANCELED is destructive in the operational sense (picker can't
      // un-cancel a CANCELED row without manual edit).
      var hasCancels = selections.some(function(s) { return s.action === "cancel_removed"; });
      if (hasCancels) {
        var count = selections.filter(function(s) { return s.action === "cancel_removed"; }).length;
        if (!confirm('Apply will mark ' + count + ' DIRECT row(s) as CANCELED. Continue?')) {
          return;
        }
      }

      busy = true;
      document.getElementById('btnApply').disabled = true;
      document.getElementById('btnCancel').disabled = true;
      showStatus('Applying ' + selections.length + ' change(s)…');
      showOverlay('Applying ' + selections.length + ' change(s)');

      var noteEl = document.getElementById('zpNote');
      var note = noteEl ? (noteEl.value || '').trim() : '';

      google.script.run
        .withSuccessHandler(onApplyOk)
        .withFailureHandler(onApplyFail)
        .applyZohoPullSelection(DIFF.soNumber, selections, note);
    }

    function onApplyOk(res) {
      busy = false;
      hideOverlay();
      if (!res || !res.ok) {
        document.getElementById('btnApply').disabled = false;
        document.getElementById('btnCancel').disabled = false;
        showStatus('✗ ' + (res && res.reason ? res.reason : 'Apply failed'), true);
        return;
      }
      // Show success screen
      renderDone(res);
    }

    function onApplyFail(err) {
      busy = false;
      hideOverlay();
      document.getElementById('btnApply').disabled = false;
      document.getElementById('btnCancel').disabled = false;
      showStatus('✗ Server error: ' + (err && err.message ? err.message : err), true);
    }

    function onCancel() {
      if (busy) return;
      google.script.host.close();
    }

    // ------------------------------------------------------------------
    // DONE SCREEN
    // ------------------------------------------------------------------
    function renderDone(res) {
      var a = res.applied || {};
      var bits = [];
      if (a.inserted > 0)        bits.push('<div class="done-result-row">✓ <strong>' + a.inserted + '</strong> row(s) inserted</div>');
      if (a.flaggedQty > 0)      bits.push('<div class="done-result-row">⚠ <strong>' + a.flaggedQty + '</strong> row(s) flagged with qty-change note</div>');
      if (a.flaggedRemoved > 0)  bits.push('<div class="done-result-row">⚠ <strong>' + a.flaggedRemoved + '</strong> row(s) flagged as REMOVED</div>');
      if (a.canceled > 0)        bits.push('<div class="done-result-row">✗ <strong>' + a.canceled + '</strong> row(s) canceled</div>');
      // Kit components are counted inside the flagged/canceled totals above, but
      // they're worth naming: the picker selected ONE kit line and more rows than
      // that changed. Saying so is what makes the cascade legible instead of
      // surprising.
      if (a.kitComponents > 0)   bits.push('<div class="done-result-row">including <strong>' + a.kitComponents + '</strong> expanded kit component(s)</div>');
      if (bits.length === 0)     bits.push('<div class="done-result-row">No changes applied</div>');

      document.getElementById('bodyEl').innerHTML =
          '<div class="done">'
        +   '<div class="done-icon">✓</div>'
        +   '<div class="done-title">Applied</div>'
        +   '<div class="done-subtitle">' + esc(res.summary || '') + '</div>'
        +   '<div class="done-result">' + bits.join('') + '</div>'
        + '</div>';

      // Footer: just a Close button
      document.getElementById('ftrEl').innerHTML =
          '<span class="ftr-summary">Done · ' + esc(res.soNumber || '') + '</span>'
        + '<div class="ftr-btns">'
        +   '<button class="btn-apply" onclick="google.script.host.close()">Close</button>'
        + '</div>';
    }

    // ------------------------------------------------------------------
    // STATUS BAR
    // ------------------------------------------------------------------
    var _statusT;
    function showStatus(msg, isError) {
      var el = document.getElementById('statusBar');
      el.textContent = msg;
      el.className = 'status shown' + (isError ? ' error' : '');
      clearTimeout(_statusT);
      _statusT = setTimeout(function() { el.classList.remove('shown'); }, isError ? 4500 : 2200);
    }

    function showOverlay(msg) {
      document.getElementById('zpOverlayMsg').textContent = (msg || 'Working');
      document.getElementById('zpOverlay').classList.add('shown');
    }
    function hideOverlay() {
      document.getElementById('zpOverlay').classList.remove('shown');
    }

    // ------------------------------------------------------------------
    // ESCAPE HELPERS
    // ------------------------------------------------------------------
    function esc(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function escAttr(s) {
      // For attribute contexts where single quotes are the delimiter
      return esc(s).replace(/'/g, '&#39;');
    }
  </script>

<script>
/* IN-PLACE LOADING (2026-10-05) — see the CSS block of the same name. Watches the
   old overlay's class ('shown' or 'on') and turns it into the in-place treatment. */
(function () {
  var ov = document.getElementById('zpOverlay');
  var msgEl = document.getElementById('zpOverlayMsg');
  var REG = '#bodyEl';
  if (!ov) return;
  var bar = document.createElement('div'); bar.className = 'wk-bar'; document.body.appendChild(bar);
  var lastBtn = null, lastAt = 0, line = null, btn = null;
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (b) { lastBtn = b; lastAt = Date.now(); }
  }, true);
  function on() {
    var region = document.querySelector(REG);
    var txt = (msgEl && msgEl.textContent || 'Working').replace(/[.\u2026\s]+$/, '');
    var subEl = ov.querySelector('[class*="sub"]');
    document.body.classList.add('wk-on');
    if (region) {
      if (!line || line.parentNode !== region) {
        if (line && line.parentNode) line.parentNode.removeChild(line);
        line = document.createElement('div'); line.className = 'wk-line';
        region.insertBefore(line, region.firstChild);
      }
      line.innerHTML = '';
      line.appendChild(document.createTextNode(txt + '\u2026'));
      if (subEl && subEl.textContent) {
        var s = document.createElement('span'); s.className = 'wk-sub'; s.textContent = '\u00b7 ' + subEl.textContent;
        line.appendChild(s);
      }
      region.scrollTop = 0;
    }
    if (lastBtn && Date.now() - lastAt < 1500 && document.body.contains(lastBtn)) {
      btn = lastBtn; btn.classList.add('wk-btn');
    }
  }
  function off() {
    document.body.classList.remove('wk-on');
    if (line && line.parentNode) line.parentNode.removeChild(line);
    line = null;
    if (btn) { btn.classList.remove('wk-btn'); btn = null; }
  }
  function sync() {
    var shown = ov.classList.contains('shown') || ov.classList.contains('on');
    shown ? on() : off();
  }
  new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (msgEl) new MutationObserver(function () { if (document.body.classList.contains('wk-on')) on(); })
    .observe(msgEl, { childList: true, characterData: true, subtree: true });
  sync();
})();
</script>
</body>
</html>
