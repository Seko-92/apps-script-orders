<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  /* MPN Finder — paste part numbers, see which ones we carry. Scoped .mf-*.
     Same skin as the Part Console: cream paper, black head, brand yellow. */
  * { box-sizing: border-box; }
  body { margin:0; background:#fff8e7; color:#1d1d1b; font-family:'Roboto',Arial,sans-serif; font-size:13px; }
  .mf-wrap { display:flex; flex-direction:column; height:100vh; }

  .mf-head { background:#1d1d1b; padding:12px 18px; display:flex; gap:12px; align-items:stretch; }
  .mf-head h1 { margin:0; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; letter-spacing:.05em; color:#ffd400; white-space:nowrap; align-self:center; }
  #mfInput { flex:1; min-height:58px; max-height:120px; resize:vertical; padding:8px 10px; border:1px solid #4a4a46; border-radius:6px; background:#2a2a27; color:#fff; font-family:'Roboto Mono',monospace; font-size:13px; }
  #mfInput::placeholder { color:#8a8a84; }
  .mf-btns { display:flex; flex-direction:column; gap:6px; }
  .mf-btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; background:#ffd400; color:#1d1d1b; font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:12px; white-space:nowrap; }
  .mf-btn.ghost { background:#3a3a36; color:#ffd966; }
  .mf-btn:disabled { opacity:.5; cursor:default; }

  .mf-summary { background:#2a2a27; color:#eee; padding:7px 18px; min-height:32px; display:flex; gap:14px; align-items:center; font-size:12px; }
  .mf-summary b { font-family:'Oswald',sans-serif; letter-spacing:.04em; }
  .mf-ok { color:#a5d6a7; } .mf-no { color:#ffab91; } .mf-dim { color:#9a9a90; margin-left:auto; }

  .mf-body { flex:1; overflow-y:auto; padding:14px 18px; }
  .mf-empty { color:#8a8a80; text-align:center; margin-top:60px; line-height:1.7; }
  .mf-group { background:#fff; border:1px solid #e5ddc7; border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .mf-qhead { display:flex; gap:10px; align-items:center; padding:7px 12px; background:#fdf6df; border-bottom:1px solid #efe5c8; }
  .mf-q { font-family:'Roboto Mono',monospace; font-weight:700; font-size:14px; }
  .mf-n { font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:#8a8a80; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  td { padding:7px 12px; border-top:1px solid #f3edd9; vertical-align:middle; }
  tr:first-child td { border-top:none; }
  .c-sku { font-family:'Roboto Mono',monospace; font-weight:700; width:84px; }
  .c-sku a { color:#1d1d1b; }
  .c-title { color:#3a3a36; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .c-loc { font-family:'Roboto Mono',monospace; font-weight:700; width:110px; }
  .c-loc.nf { color:#b06a00; font-weight:400; }
  .c-qty { width:60px; text-align:right; font-family:'Oswald',sans-serif; font-size:16px; font-weight:600; }
  .c-qty.zero { color:#b71c1c; }
  .c-price { width:80px; text-align:right; font-family:'Roboto Mono',monospace; }
  .c-via { width:250px; text-align:right; }
  .tag { font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:9px; background:#eee7cf; color:#6b5d2e; white-space:nowrap; }
  .tag.extra { background:#fff0b3; color:#6b5200; }
  .tag.ended { background:#e0e0e0; color:#555; }
  .tag.kit { background:#5a3d91; color:#fff; }   /* same purple as the Part Console's KIT badge */
  tr.is-kit td { background:#fbf9ff; }
  .mf-missing { background:#fff; border:1px dashed #d9c58a; border-radius:10px; padding:10px 12px; margin-top:14px; }
  .mf-missing h3 { margin:0 0 6px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#8a5a00; }
  .mf-missing span { display:inline-block; font-family:'Roboto Mono',monospace; background:#fdf6df; border-radius:5px; padding:2px 7px; margin:2px 4px 2px 0; }
  .mf-hint { font-size:11px; color:#8a8a80; margin-top:6px; }

  .mf-veil { position:fixed; inset:0; background:rgba(24,23,21,.45); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; color:#ffd400; font-family:'Oswald',sans-serif; letter-spacing:.06em; font-size:14px; }
  .mf-veil.on { display:flex; }
  .mf-toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#1d1d1b; color:#ffd400; padding:8px 14px; border-radius:8px; font-family:'Oswald',sans-serif; letter-spacing:.04em; display:none; }
</style>
</head>
<body>
<div class="mf-wrap">
  <div class="mf-head">
    <h1>MPN FINDER</h1>
    <textarea id="mfInput" placeholder="Paste part numbers — one, many, or the whole list from SERPIC (0415 7075 is fine)" spellcheck="false"></textarea>
    <div class="mf-btns">
      <button class="mf-btn" id="mfGo" onclick="run()">Find</button>
      <button class="mf-btn ghost" id="mfCopy" onclick="copyReply()" disabled>Copy for customer</button>
    </div>
  </div>
  <div class="mf-summary" id="mfSummary"></div>
  <div class="mf-body" id="mfBody">
    <div class="mf-empty">Paste the part numbers from the engine lookup and press <b>Find</b> (Ctrl+Enter).<br>
      Every number on a listing is searched — not just the first one eBay matches.</div>
  </div>
</div>
<div class="mf-veil" id="mfVeil">SEARCHING MASTER INVENTORY…</div>
<div class="mf-toast" id="mfToast"></div>

<script>
var INIT = <?!= initJson ?>;
var last = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function money(v) { return (v == null) ? '—' : '$' + Number(v).toFixed(2); }

function run() {
  var text = document.getElementById('mfInput').value.trim();
  if (!text) return;
  setBusy(true);
  google.script.run
    .withSuccessHandler(function (res) { setBusy(false); render(res); })
    .withFailureHandler(function (e) { setBusy(false); render({ ok:false, reason: (e && e.message) || String(e) }); })
    .getMpnSearch(text);
}

function setBusy(on) {
  document.getElementById('mfVeil').className = 'mf-veil' + (on ? ' on' : '');
  document.getElementById('mfGo').disabled = on;
}

function render(res) {
  last = res;
  var sum = document.getElementById('mfSummary'), body = document.getElementById('mfBody');
  document.getElementById('mfCopy').disabled = !(res && res.ok && res.found);
  if (!res || !res.ok) {
    sum.innerHTML = '<span class="mf-no">' + esc((res && res.reason) || 'Search failed') + '</span>';
    body.innerHTML = '';
    return;
  }
  sum.innerHTML = '<span><b>' + res.results.length + '</b> number' + (res.results.length === 1 ? '' : 's') + '</span>' +
    '<span class="mf-ok">✓ ' + res.found + ' carried</span>' +
    '<span class="mf-no">✗ ' + res.missing + ' not carried</span>' +
    '<span class="mf-dim">' + res.columns + ' part-number columns · ' + (res.ms / 1000).toFixed(1) + 's</span>';

  var html = '', missing = [];
  res.results.forEach(function (x) {
    if (!x.matches.length) { missing.push(x.query); return; }
    html += '<div class="mf-group"><div class="mf-qhead"><span class="mf-q">' + esc(x.query) + '</span>' +
            '<span class="mf-n">' + x.matches.length + ' listing' + (x.matches.length === 1 ? '' : 's') + '</span></div><table>';
    x.matches.forEach(function (m) {
      var tags = '<span class="tag' + (m.via === 'main' ? '' : ' extra') + '">' +
                 (m.via === 'main' ? 'main MPN' : esc(m.via)) + '</span>';
      if (m.isKit) tags = '<span class="tag kit">kit</span> ' + tags;
      if (!m.active) tags += ' <span class="tag ended">' + esc(m.status || 'ended') + '</span>';
      html += '<tr' + (m.isKit ? ' class="is-kit"' : '') + '>' +
        '<td class="c-sku">' + (m.url ? '<a href="' + esc(m.url) + '" target="_blank">' + esc(m.sku) + '</a>' : esc(m.sku)) + '</td>' +
        '<td class="c-title" title="' + esc(m.title) + '">' + esc(m.title) + '</td>' +
        '<td class="c-loc' + (m.location === 'NOT FOUND' ? ' nf' : '') + '">' + esc(m.location) + '</td>' +
        '<td class="c-qty' + ((m.available || 0) <= 0 ? ' zero' : '') + '">' + (m.available == null ? '—' : m.available) + '</td>' +
        '<td class="c-price">' + money(m.price) + '</td>' +
        '<td class="c-via">' + tags + '</td></tr>';
    });
    html += '</table></div>';
  });
  if (missing.length) {
    html += '<div class="mf-missing"><h3>Not on any listing (' + missing.length + ')</h3>' +
      missing.map(function (q) { return '<span>' + esc(q) + '</span>'; }).join('') +
      '<div class="mf-hint">Logged in “MPN Search Log” — numbers asked for often are worth listing.</div></div>';
  }
  body.innerHTML = html || '<div class="mf-empty">Nothing carried for these numbers.</div>';
}

/** Plain text the user can paste to the customer: what we have, with links. */
function copyReply() {
  if (!last || !last.ok) return;
  var lines = [];
  last.results.forEach(function (x) {
    var m = x.matches.filter(function (y) { return y.active; })[0] || x.matches[0];
    if (!m) return;
    lines.push(x.query + ' — ' + m.title + (m.price != null ? ' — ' + money(m.price) : '') +
               ((m.available || 0) <= 0 ? ' (currently out of stock)' : '') + (m.url ? '\n' + m.url : ''));
  });
  var text = lines.join('\n\n');
  var ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  toast(ok ? 'Copied ' + lines.length + ' item' + (lines.length === 1 ? '' : 's') : 'Copy blocked — select and copy manually');
}

function toast(t) {
  var el = document.getElementById('mfToast');
  el.textContent = t; el.style.display = 'block';
  setTimeout(function () { el.style.display = 'none'; }, 2200);
}

document.getElementById('mfInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});

if (INIT.text) document.getElementById('mfInput').value = INIT.text;
if (INIT.res) render(INIT.res);
document.getElementById('mfInput').focus();
</script>
</body>
</html>
