<!doctype html>
<html><head><meta charset="utf-8"><title>HQ Alerts</title>
<style>
  :root { --ink:#f5f5f2; --dim:#9a988f; --ground:#141413; --card:#1d1d1b; --rule:#2e2d2a;
          --yellow:#ffd400; --red:#ff6b6b; --green:#6fcf7f; }
  * { box-sizing:border-box; }
  body { margin:0; width:300px; background:var(--ground); color:var(--ink);
         font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:2px solid var(--yellow); }
  header img { width:26px; height:26px; }
  header b { font-size:14px; letter-spacing:.06em; text-transform:uppercase; }
  .state { padding:10px 14px; border-bottom:1px solid var(--rule); }
  .big { font-weight:700; font-size:14px; }
  .big.ok { color:var(--green); } .big.bad { color:var(--red); } .big.rest { color:var(--dim); }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; }
  .holds { padding:8px 14px; background:#3a1414; color:#ffd7d7; border-bottom:1px solid var(--rule); }
  .holds b { color:var(--red); }
  h2 { margin:0; padding:10px 14px 4px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  ol { list-style:none; margin:0; padding:0 14px 10px; }
  li { display:flex; gap:8px; padding:3px 0; font-size:12px; }
  li time { color:var(--dim); flex:0 0 58px; font-variant-numeric:tabular-nums; }
  li .y { color:var(--yellow); } li .r { color:var(--red); } li .g { color:var(--green); } li .none { color:var(--dim); }
  .btns { display:flex; gap:8px; padding:10px 14px 14px; }
  button { flex:1; padding:8px; border-radius:6px; border:1px solid var(--rule); background:var(--card);
           color:var(--ink); font:inherit; cursor:pointer; }
  button.primary { background:var(--yellow); color:#111; border-color:var(--yellow); font-weight:700; }
  button:hover { filter:brightness(1.1); }
</style></head>
<body>
  <header><img src="icons/hq-48.png" alt=""><b>HQ Alerts</b></header>
  <div class="state"><div class="big" id="big">…</div><div class="sub" id="sub"></div></div>
  <div class="holds" id="holds" hidden></div>
  <h2>Last sent on this PC</h2>
  <ol id="log"></ol>
  <div class="btns">
    <button class="primary" id="btnBoard">Open board</button>
    <button id="btnTest">Test</button>
  </div>
<script src="popup.js"></script>
</body></html>
