<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#4a4a4a;padding:18px;font-family:'Roboto Mono',monospace}
 .lbl{color:#ddd;font:11px/1.7 'Roboto Mono',monospace;margin:20px 0 6px}
 .lbl b{color:#ffd400}
 .note{color:#9a9a9a;font:10px/1.6 'Roboto Mono',monospace;margin:3px 0 0}

 /* ── the sheet. Bands bleed past J; tables stop at it. ───────────────────── */
 .sheet{width:1170px;box-shadow:0 2px 16px rgba(0,0,0,.5)}
 .bleed{width:70px}                       /* K:T, off the right edge */
 .row{display:flex;overflow:hidden}
 .z{height:100%;display:flex;align-items:center;flex:none;overflow:hidden;position:relative}

 /* row 1 — the masthead. 56px, ink end to end, bleeding. */
 .r1{height:56px;background:#1a1a1a}
 .mast{width:287px}   .mast img{display:block;width:287px;height:56px}
 .head{width:233px;padding:0 13px}
 .puls{width:306px;padding:0 13px;border-left:1px solid rgba(255,255,255,.09)}
 .curv{width:344px;padding:0 13px;border-left:1px solid rgba(255,255,255,.09)}
 .head .t,.puls .t{font-family:Oswald;font-weight:400;font-size:11.5px;letter-spacing:.05em;
                   color:#e8e8e8;line-height:1.4;white-space:pre-line}
 .bars{display:flex;align-items:flex-end;gap:2px;height:28px;width:100%}
 .bars i{flex:1;min-height:1px;border-radius:.5px;background:#ffd400}

 /* row 2 — the eBay table's NAME. One warm charcoal plate, also bleeding. */
 .r2{height:44px;background:#2a2724}
 .logo{width:962px;padding-left:12px}     /* A2:F2 */
 .logo img{height:30px;display:block}
 .plate{width:208px;padding-right:14px;justify-content:flex-end}  /* G2:H2 */
 .np{font-family:Oswald;font-weight:700;font-size:10px;letter-spacing:.07em;color:#8a8f98;white-space:nowrap}

 /* the tables — defined blocks that STOP at J */
 .hdr{height:30px;background:#1a1a1a}
 .hdr .c{font-family:Oswald;font-weight:700;font-size:9.5px;letter-spacing:.1em;color:#ffd400;
         padding:0 10px;display:flex;align-items:center;height:100%;flex:none}
 .dr{height:26px;background:#fff}
 .dr.alt{background:#fff8e7}
 .dr .c{font-family:'Roboto Mono';font-size:10px;color:#1a1a1a;padding:0 10px;
        display:flex;align-items:center;height:100%;flex:none}

 /* the divider — the ONE gold object, and it bleeds too */
 .div{height:40px;background:#ffd400;border-top:3px solid #1a1a1a;border-bottom:3px solid #1a1a1a}
 .div .left{width:962px;padding-left:12px;font-family:Oswald;font-weight:700;font-size:16px;color:#1a1a1a}
 .div .right{width:208px;padding-right:14px;justify-content:flex-end;
             font-family:Oswald;font-weight:700;font-size:10px;letter-spacing:.07em;color:#1a1a1a}
</style></head><body><div id="out"></div>
<script>
const COLS=[110,73,104,233,306,136,104,104];   // A..H (approx; D=233 E=306 by design)
const CELLS=['◆ SKU','# QTY','LOCATION','SALES ORDER','NOTE','STATUS','◫ HAND','☑ LEFT'];
const ROWS=[
 ['165447','2','A-31','24-14979-87359','Buyer Note: leave at door','PENDING','12','—'],
 ['173817','1','B-12','24-15008-33107','','PREPARING','4','—']
];
const cw=i=>COLS[i]+'px';

function tableRows(){
  let h='<div class="row hdr">';
  CELLS.forEach((c,i)=>h+=`<div class="c" style="width:${cw(i)}">${c}</div>`);
  h+='</div>';
  ROWS.forEach((r,ri)=>{
    h+=`<div class="row dr${ri?' alt':''}">`;
    r.forEach((v,i)=>h+=`<div class="c" style="width:${cw(i)}">${v}</div>`);
    h+='</div>';
  });
  return h;
}

function banner(state,hour,head,ebayN,directN){
  const face=`mast/${state}-h${String(hour).padStart(2,'0')}-v4.png`;
  return `
  <div class="sheet">
    <div class="row r1">
      <div class="z mast"><img src="renders/${face}"></div>
      <div class="z head"><div class="t">${head}</div></div>
      <div class="z puls"><div class="t">⏱ Last sync · 4:45 PM   🟢 ALIVE  4m ago</div></div>
      <div class="z curv"><div class="bars">${
        [0,0,0,0,0,0,1,3,6,9,14,18,22,19,15,11,7,5,3,1,0,0,0,0]
          .map(v=>`<i style="height:${Math.max(1,v/22*28)}px;opacity:${v?1:.18}"></i>`).join('')
      }</div></div>
      <div class="z bleed"></div>
    </div>

    <div class="row r2">
      <div class="z logo"><img src="renders/mast/ebay-v2.png"></div>
      <div class="z plate"><span class="np">HQMS · EBAY ORDERS · ${ebayN} waiting</span></div>
      <div class="z bleed"></div>
    </div>

    ${tableRows()}

    <div class="row div">
      <div class="z left">▌  DIRECT</div>
      <div class="z right">HQMS · DIRECT ORDERS · ${directN} waiting</div>
      <div class="z bleed"></div>
    </div>

    ${tableRows()}
  </div>`;
}

const S=[
 ['<b>BUSY</b> · 11am — the shift, mid-morning','busy',11,'12 to grab\n4 in · 9 out',12,4],
 ['<b>LATE</b> · 5pm — something crossed the 3h line','late',17,'oldest 3h 14m\n12 still waiting',12,4],
 ['<b>REST</b> · 9pm — the floor is closed','rest',21,'opens in 11h 44m · 12 waiting',12,4],
 ['<b>CLEAR</b> · 8am — nothing waiting','clear',8,'4 in · 9 out',0,0]
];
document.getElementById('out').innerHTML =
  `<div class="lbl">ROW 1 states the day · ROW 2 names the eBay table · the gold divider names DIRECT.
  <span class="note">Bands bleed past column J; the two tables stop at it.</span></div>` +
  S.map(([lbl,st,h,head,e,d])=>`<div class="lbl">${lbl}</div>${banner(st,h,head,e,d)}`).join('');
document.documentElement.setAttribute('data-ready','1');
</script></body></html>
