<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#4a4a4a;padding:16px;font-family:'Roboto Mono',monospace}
 .lbl{color:#ddd;font:11px/1.7 'Roboto Mono',monospace;margin:16px 0 5px}
 .lbl b{color:#ffd400}
 .bn{width:1170px;box-shadow:0 2px 14px rgba(0,0,0,.45)}
 .r1{height:52px;display:flex;background:#1a1a1a;position:relative;overflow:hidden}
 .r2{height:65px;display:flex;position:relative;overflow:hidden;border-top:2px solid #ffd400}
 .z{height:100%;display:flex;align-items:center;overflow:hidden;position:relative;flex:none}
 .mast{width:287px}  .mast img{display:block;width:280px;height:44px;margin:4px 0 0 0}
 .head{width:233px;padding:0 12px}
 .puls{width:306px;padding:0 12px;border-left:1px solid rgba(255,255,255,.09)}
 .curv{width:344px;padding:0 12px;border-left:1px solid rgba(255,255,255,.09)}
 .head .t{font-family:Oswald;font-weight:400;font-size:12px;letter-spacing:.05em;color:#f0f0f0;line-height:1.35;white-space:pre-line}
 .puls .t{font-family:Oswald;font-weight:500;font-size:12.5px;letter-spacing:.09em}
 .bars{display:flex;align-items:flex-end;gap:2px;height:26px;width:100%}
 .bars i{flex:1;min-height:1px;border-radius:.5px}
 /* row 2 treatments */
 .logo{width:826px;display:flex;align-items:center;justify-content:center;position:relative}
 .logo img{height:34px}
 .pick{width:234px;background:#1a1a1a;color:#ffd400;font-family:Oswald;font-size:11px;
       font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;
       border-left:1px solid rgba(255,212,0,.25)}
 .pick.b{width:110px}
 .sky{position:absolute;inset:0;overflow:hidden}
 .sky .grad{position:absolute;inset:0}
 .sky .orb{position:absolute;border-radius:50%;filter:blur(.4px)}
 .sky .star{position:absolute;background:#fff;border-radius:50%}
 .sky .horiz{position:absolute;left:0;right:0;bottom:0;height:1px}
 .tick{position:absolute;bottom:3px;font:8px/1 'Roboto Mono';color:rgba(255,255,255,.30);letter-spacing:.1em}
</style></head><body><div id="out"></div>
<script>
const DAY=[0,0,0,0,0,0,1,3,6,9,14,18,22,19,15,11,7,5,3,1,0,0,0,0], NOWH=15, mx=Math.max(...DAY,1);
// the SAME light curve the face uses — one palette across the whole banner
function dayLight(h){const sun=Math.max(0,Math.cos(((h-13)/24)*Math.PI*2));
 const golden=Math.max(0,1-Math.abs(sun-0.30)*3.4), dusk=h>=16&&h<=21;
 const g=0.055+sun*0.055;
 return {ground:`rgb(${Math.round(255*(g+.012))},${Math.round(255*(g+.006))},${Math.round(255*(g*.86))})`,
  sky: sun<0.06?'#2b3a5e':(golden>0.45?(dusk?'#ff6a1f':'#ffa23d'):'#ffe9a8'),
  skyO:(0.10+sun*0.30+golden*0.34), sun, golden};}
// the day curve takes the hour's colour too, so the whole row shares one light
function curveColour(h){const L=dayLight(h);
 if(h<6||h>=22) return '#4a5570'; if(h<9) return '#ffa23d';
 if(h<16) return '#ffd400';       if(h<19) return '#ff8a3d'; return '#8a7550';}
function bars(h){const c=curveColour(h);
 return DAY.map((v,i)=>`<i style="height:${i>h?0:Math.max(3,v/mx*100)}%;background:${c}"></i>`).join('');}
function stars(n,seed){let s='';for(let i=0;i<n;i++){const x=(Math.sin(seed+i*12.9)*.5+.5)*100,
 y=(Math.sin(seed+i*78.2)*.5+.5)*70, r=(Math.sin(seed+i*3.1)*.5+.5)*1.1+.3;
 s+=`<div class="star" style="left:${x}%;top:${y}%;width:${r}px;height:${r}px;opacity:${.25+r*.4}"></div>`;}return s;}
// row 2 as a SKY: the working day laid left→right, an orb at the current hour
function skyHTML(h){const L=dayLight(h), night=L.sun<0.10;
 // ⚠ TWO ARCS, not one. Day maps 6a→6p across the width; night maps 6p→6a, so the moon
 //   travels instead of parking against the right edge. A single arc clamped everything
 //   after 18:00 into the same spot.
 const f = night ? (((h + 6) % 24) / 12) : ((h - 6) / 12);
 const x = Math.max(3, Math.min(97, f * 100));
 const y = night ? (30 - Math.sin(f * Math.PI) * 16) : (58 - Math.sin(f * Math.PI) * 40);
 const orbC=night?'#cfd6e6':(L.golden>0.45?'#ffb347':'#fff3c4');
 const orbS=night?9:15;
 return `<div class="sky">
   <div class="grad" style="background:
     linear-gradient(180deg, ${L.sky}${night?'22':'55'} 0%, transparent 62%),
     radial-gradient(60% 130% at ${x}% 92%, ${L.sky}${night?'18':'66'} 0%, transparent 60%),
     ${L.ground}"></div>
   ${night?stars(26,h):''}
   <div class="orb" style="left:${x}%;top:${y}%;width:${orbS}px;height:${orbS}px;
        background:${orbC};box-shadow:0 0 ${night?10:26}px ${orbC}${night?'66':'99'}"></div>
   <div class="horiz" style="background:linear-gradient(90deg,transparent,${L.sky},transparent);opacity:${night?.25:.7}"></div>
   ${night?'':`<div style="position:absolute;left:25%;right:8.4%;bottom:0;height:2px;
        background:linear-gradient(90deg,transparent,${L.sky}88,transparent);opacity:.55"></div>`}
   <div class="tick" style="left:10px">${night?'6p':'6a'}</div>
   <div class="tick" style="right:10px">${night?'6a':'6p'}</div>
   ${night?'':'<div class="tick" style="left:25%">9</div><div class="tick" style="right:8.4%">5</div>'}
 </div>`;}
const EBAY='ebay.png';
function row1(h,state,head,pulse,pc){return `<div class="r1">
  <div class="z mast"><img src="renders/mast/${state}-h${String(h).padStart(2,'0')}-v2.png"></div>
  <div class="z head"><div class="t">${head}</div></div>
  <div class="z puls"><div class="t" style="color:${pc}">${pulse}</div></div>
  <div class="z curv"><div class="bars">${bars(h)}</div></div></div>`;}
function row2(kind,h){
  if(kind==='cream') return `<div class="r2"><div class="z logo" style="background:#fff8e7"><img src="${EBAY}"></div>
     <div class="z pick">Pick ID for Shipping ▾</div><div class="z pick b">Pick ID · Adj ▾</div></div>`;
  if(kind==='ink')   return `<div class="r2"><div class="z logo" style="background:#1a1a1a"><img src="${EBAY}"></div>
     <div class="z pick">Pick ID for Shipping ▾</div><div class="z pick b">Pick ID · Adj ▾</div></div>`;
  if(kind==='sky2') return `<div class="r2"><div class="z logo">${skyHTML(h)}</div>
     <div class="z pick">Pick ID for Shipping ▾</div><div class="z pick b">Pick ID · Adj ▾</div></div>`;
  return `<div class="r2"><div class="z logo" style="justify-content:flex-start;padding-left:26px">${skyHTML(h)}<img src="${EBAY}" style="position:relative;z-index:2;height:26px;opacity:.85"></div>
     <div class="z pick">Pick ID for Shipping ▾</div><div class="z pick b">Pick ID · Adj ▾</div></div>`;}
const SCENES=[
 {h:11,state:'busy',head:'12 TO GRAB\n4 ebay · 8 direct',pulse:'⏱ 🟢 ALIVE · 11:02 AM · 2m ago',pc:'#7ddc7d'},
 {h:15,state:'busy',head:'12 TO GRAB\n4 ebay · 8 direct',pulse:'⏱ 🟢 ALIVE · 3:04 PM · 3m ago',pc:'#7ddc7d'},
 {h:8, state:'rest',head:'12 waiting\nopens in 1h 0m',  pulse:'⏱ ⚪ RESTING · 7:12 AM · 48m ago',pc:'#9aa3b0'},
 {h:22,state:'rest',head:'all clear\nopens in 11h 0m',  pulse:'⏱ ⚪ RESTING · 4:58 PM · 5h 2m ago',pc:'#9aa3b0'}];
const KINDS=[['sky',  'C1 · row 2 becomes THE DAY — sun walks 6a→6p, moon walks 6p→6a, logo kept small at the left'],
             ['sky2', 'C2 · the same, logo retired — the sheet has TWO channels now, only one has a badge'],
             ['ink',  'B · one ground, no sky — the safe version']];
document.getElementById('out').innerHTML = KINDS.map(([k,label])=>
 `<div class="lbl"><b>${label}</b></div>` +
 SCENES.map(s=>`<div class="bn">${row1(s.h,s.state,s.head,s.pulse,s.pc)}${row2(k,s.h)}</div><div style="height:9px"></div>`).join('')
).join('');
document.documentElement.setAttribute('data-ready','1');
</script></body></html>
