<!DOCTYPE html>
<html>
<head>
  <base target="_top">
<!-- 2026-10-03: load the faces every rule below asks for (they were never loaded). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">

  <meta charset="utf-8">
  <style>
    /* =====================================================================
     * PricePushModal.html — review/confirm bulk eBay→Zoho price writes
     *
     * Picker highlights drift rows on the Price Audit sheet, reviews each
     * here (Zoho before → eBay after, big swings flagged amber), unchecks
     * anything, types the passphrase, Applies. n8n writes synchronously and
     * the done screen shows a per-SKU report.
     *
     * Brand palette mirrors ZohoPullModal / KitExpansionModal.
     * ===================================================================== */

    :root {
      --ink:           #1a1a1a;
      --ink-mute:      #5f5f5f;
      --paper:         #ffffff;
      --paper-warm:    #fff8e7;
      --paper-tint:    #fffbf0;
      --brand-yellow:        #ffd400;
      --brand-yellow-soft:   #fff4b0;
      --brand-yellow-rim:    #ffb800;
      --green-ink:     #1b5e20;
      --green-bg:      #e8f5e9;
      --green-rim:     #66bb6a;
      --amber-ink:     #6b4500;
      --amber-bg:      #fff4e0;
      --amber-rim:     #f57c00;
      --red-ink:       #b71c1c;
      --red-bg:        #ffe5e5;
      --red-rim:       #e57373;
      --slate-ink:     #455a64;
      --slate-bg:      #eceff1;
      --slate-rim:     #90a4ae;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0; padding: 0;
      font-family: 'Roboto', Arial, sans-serif;
      font-size: 13px; color: var(--ink);
      background: var(--paper-warm); overflow: hidden;
    }
    .wrap { display: flex; flex-direction: column; height: 100vh; width: 100%; }

    /* ----- HEADER ----- */
    .hdr {
      flex: 0 0 auto; padding: 12px 16px 8px;
      background: var(--ink); color: var(--paper);
      border-bottom: 3px solid var(--brand-yellow);
    }
    .hdr-row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .hdr-title {
      font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .hdr-sub { color: #d4d4d4; font-size: 13px; }
    .hdr-row2 { margin-top: 6px; font-size: 12px; color: #c0c0c0; letter-spacing: 0.02em; }
    .chip-summary {
      display: inline-block; padding: 1px 6px; margin: 0 4px; border-radius: 3px;
      background: rgba(255, 212, 0, 0.15); border: 1px solid rgba(255, 212, 0, 0.4);
      color: var(--brand-yellow); font-family: 'Oswald', sans-serif; font-weight: 600;
      font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .hdr-warn {
      margin-top: 6px; padding: 5px 8px; border-radius: 3px;
      background: rgba(229, 57, 53, 0.18); border: 1px solid var(--red-rim);
      color: #ffd1d1; font-size: 11.5px;
    }

    /* ----- BODY ----- */
    .body { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px; }

    /* ----- LINE CARD ----- */
    .line {
      display: grid; grid-template-columns: 28px 1fr auto; gap: 10px;
      align-items: center; padding: 9px 12px; margin-bottom: 7px;
      background: var(--paper); border-radius: 4px;
      border-left: 3px solid var(--slate-rim);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: opacity 160ms ease, background 160ms ease;
    }
    .line.high   { border-left-color: var(--brand-yellow-rim); background: #fffbf0; }
    .line.low    { border-left-color: var(--amber-rim);  background: var(--amber-bg); }
    .line.swing  { border-left-color: var(--amber-rim); background: #fff1d6; }
    .line.skip   { border-left-color: var(--slate-rim); background: var(--slate-bg); opacity: 0.72; }
    .line.unchecked { opacity: 0.5; }

    .line-cb { display: flex; align-items: center; justify-content: center; }
    .line-cb input[type=checkbox] {
      width: 18px; height: 18px; cursor: pointer; accent-color: var(--brand-yellow-rim);
    }
    .line-cb .locked {
      font-size: 10px; color: var(--ink-mute); font-family: 'Oswald', sans-serif;
      letter-spacing: 0.04em; transform: rotate(-90deg); white-space: nowrap;
    }

    .line-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .line-row1 { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
    .line-sku { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 13.5px; }
    .line-name { color: var(--ink-mute); font-size: 12.5px; }
    .line-row2 { font-family: 'Roboto Mono', monospace; font-size: 12px; color: var(--ink-mute); }
    .price-before { color: var(--ink-mute); }
    .price-arrow  { color: var(--amber-rim); font-weight: 700; padding: 0 4px; }
    .price-after  { color: var(--ink); font-weight: 700; }
    .price-delta  { color: var(--amber-ink); font-weight: 700; margin-left: 6px; }
    .skip-reason  { color: var(--ink-mute); font-style: italic; font-family: 'Roboto', sans-serif; }

    .line-chips { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .chip {
      padding: 1px 7px; border-radius: 3px; font-family: 'Oswald', sans-serif;
      font-weight: 700; font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; white-space: nowrap;
    }
    .chip.high   { background: var(--brand-yellow-soft); color: var(--amber-ink); border: 1px solid var(--brand-yellow-rim); }
    .chip.low    { background: #ffd699; color: #7a3d00; border: 1px solid var(--amber-rim); }
    .chip.swing  { background: #ffe0b2; color: #7a3d00; border: 1px solid var(--amber-rim); }
    .chip.skip   { background: var(--slate-bg); color: var(--slate-ink); border: 1px solid var(--slate-rim); }

    /* ----- FOOTER ----- */
    .ftr {
      flex: 0 0 auto; padding: 10px 14px; border-top: 2px solid var(--brand-yellow);
      background: var(--paper-tint); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .ftr-pass {
      display: flex; align-items: center; gap: 6px;
      font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--ink-mute);
    }
    .ftr-pass input {
      font-family: 'Roboto Mono', monospace; font-size: 12px;
      padding: 5px 8px; border: 1px solid #c0c0c0; border-radius: 4px; width: 130px;
    }
    .ftr-summary { flex: 1; font-family: 'Roboto Mono', monospace; font-size: 12px; color: var(--ink); }
    .ftr-summary.warn { color: var(--amber-ink); font-weight: 600; }
    .ftr-btns { display: flex; gap: 8px; }
    .btn-cancel {
      background: transparent; color: var(--ink-mute); border: 1px solid #c0c0c0;
      padding: 7px 14px; font-family: 'Oswald', sans-serif; font-size: 12px;
      letter-spacing: 0.06em; text-transform: uppercase; border-radius: 4px; cursor: pointer;
      transition: all 130ms ease;
    }
    .btn-cancel:hover:not(:disabled) { background: rgba(0,0,0,0.05); color: var(--ink); }
    .btn-apply {
      background: var(--brand-yellow); color: var(--ink); border: 1px solid var(--brand-yellow-rim);
      padding: 7px 16px; font-family: 'Oswald', sans-serif; font-size: 12.5px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; border-radius: 4px; cursor: pointer;
      transition: all 130ms ease;
    }
    .btn-apply:hover:not(:disabled) { background: var(--brand-yellow-rim); box-shadow: 0 3px 10px rgba(255, 212, 0, 0.5); }
    .btn-apply:disabled, .btn-cancel:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ----- STATUS / DONE ----- */
    .status {
      position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--brand-yellow); padding: 8px 16px; border-radius: 4px;
      font-family: 'Roboto Mono', monospace; font-size: 12px; opacity: 0; pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .status.shown { opacity: 1; transform: translateX(-50%) translateY(0); }
    .status.error { background: var(--red-ink); color: #fff; }

    /* ----- LOADING OVERLAY (during the synchronous n8n price push) ----- */
    /* The push fires n8n synchronously and can take up to a minute — without
       a clear overlay the greyed buttons read as a frozen window and a picker
       might force-close mid-write. */
    /* Frosted veil + dual-ring brand spinner — matches Kit Expansion (2026-07-31). */
    .px-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(24, 23, 21, 0.52);
      -webkit-backdrop-filter: blur(3.5px) saturate(0.9);
      backdrop-filter: blur(3.5px) saturate(0.9);
      border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      opacity: 0; pointer-events: none; transition: opacity 180ms;
    }
    .px-overlay.shown { opacity: 1; pointer-events: all; }
    .px-spinner { position: relative; width: 60px; height: 60px; }
    .px-spinner::before, .px-spinner::after {
      content: ''; position: absolute; border-radius: 50%; border: 3px solid transparent;
    }
    .px-spinner::before {
      inset: 0; border-top-color: var(--brand-yellow); border-right-color: rgba(255,212,0,0.30);
      animation: px-spin 0.85s linear infinite;
    }
    .px-spinner::after {
      inset: 12px; border-bottom-color: rgba(255,212,0,0.55);
      animation: px-spin 1.3s linear infinite reverse;
    }
    .px-spinner-dot {
      position: absolute; inset: 24px; border-radius: 50%; background: var(--brand-yellow);
      box-shadow: 0 0 10px rgba(255,212,0,0.55); animation: px-pulse 1.15s ease-in-out infinite;
    }
    @keyframes px-spin { to { transform: rotate(360deg); } }
    @keyframes px-pulse { 0%,100%{ transform: scale(0.65); opacity:0.5; } 50%{ transform: scale(1); opacity:1; } }
    .px-overlay-msg {
      font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-yellow);
      text-align: center; padding: 0 24px;
    }
    .px-overlay-msg::after { content: ''; animation: px-dots 1.5s steps(1, end) infinite; }
    @keyframes px-dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';} }
    .px-overlay-sub { font-family: 'Roboto', sans-serif; font-size: 12px; color: #d0d0d0; margin-top: -8px; text-align: center; padding: 0 24px; }

    .done { padding: 22px 24px; }
    .done-head { text-align: center; margin-bottom: 14px; }
    .done-icon { font-size: 34px; }
    .done-title {
      font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; margin-top: 4px;
    }
    .done-sub { color: var(--ink-mute); font-size: 13px; margin-top: 2px; }
    .report-row {
      display: flex; gap: 8px; align-items: baseline; padding: 4px 10px; margin-bottom: 4px;
      background: var(--paper); border-radius: 3px; border-left: 3px solid var(--green-rim);
      font-family: 'Roboto Mono', monospace; font-size: 12px;
    }
    .report-row.fail { border-left-color: var(--red-rim); background: var(--red-bg); }
    .report-sku { font-weight: 700; min-width: 90px; }
    .report-detail { color: var(--ink-mute); }
    .report-detail.err { color: var(--red-ink); }
  
/* ═══════════════════════════════════════════════════════════════════════════
   ONE SURFACE (2026-10-03) — the owner's call after a review round.
   Google draws a white frame, a title and a close button around every modal,
   and none of it can be styled. A cream page with a full-bleed black band
   inside that frame read as "a sticker on white paper". So the page now
   CONTINUES the frame: white ground, Google's title is the window's only
   title (ours is hidden), no full-bleed bands. Panels float on soft layered
   shadows; inputs are pressed in; primary buttons are raised yellow keys.
   Black and yellow stay where they carry meaning, as rounded objects, never
   as bands. Same rule in all seven windows, so they read as one family.
   Appended LAST so it overrides without editing the rules above.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --os-ease: cubic-bezier(.37,0,.63,1);
  --os-raise: 0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(70,52,0,.06),
              0 5px 12px rgba(70,52,0,.07), 0 18px 36px -16px rgba(70,52,0,.22);
  --os-lift: 0 1px 2px rgba(70,52,0,.07), 0 4px 10px rgba(70,52,0,.07);
  --os-press: inset 0 2px 3px rgba(70,52,0,.10);
  --os-key: inset 0 1px 0 rgba(255,255,255,.7), 0 3px 0 #b89500, 0 7px 16px rgba(184,149,0,.30);
  --os-key-hover: inset 0 1px 0 rgba(255,255,255,.7), 0 4px 0 #b89500, 0 10px 20px rgba(184,149,0,.32);
  --os-key-down: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 #b89500, 0 2px 6px rgba(184,149,0,.28);
  --os-yellow: linear-gradient(180deg,#ffe45c 0%,#ffcf00 100%);
  --os-panel: linear-gradient(180deg,#fffaee,#fff6e2);
  --os-rim: rgba(150,115,20,.16);
}
html, body { background: #fff !important; }
@keyframes os-rise { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.hdr{ background:none !important; color:#1d1d1b !important; border-bottom:none !important; padding:0 12px 10px !important; }
.hdr-title{ display:none !important; }
.hdr-sub{ color:#5f5f5f !important; }
.hdr-row2{ color:#6e6450 !important; }
.chip-summary{ background:#fff4b0 !important; border:1px solid #e6cf5c !important; color:#5c4600 !important; border-radius:999px !important; }
.body{ background:#fff !important; padding-left:12px !important; padding-right:12px !important; }
.line{ border-radius:12px !important; box-shadow: var(--os-lift) !important; animation: os-rise 380ms var(--os-ease) both; }
.ftr{ background: #fff !important; border-top: 1px solid var(--os-rim) !important;
  box-shadow: 0 -8px 16px -10px rgba(70,52,0,.16) !important; }
.btn-apply{ background: var(--os-yellow) !important; border: none !important; border-radius: 9px !important;
  box-shadow: var(--os-key) !important; transition: transform 120ms var(--os-ease), box-shadow 120ms var(--os-ease), filter 200ms var(--os-ease) !important; }
.btn-apply:hover:not(:disabled){ transform: translateY(-1px); box-shadow: var(--os-key-hover) !important; filter: brightness(1.03); }
.btn-apply:active:not(:disabled){ transform: translateY(3px); box-shadow: var(--os-key-down) !important; }
.btn-cancel{ background: #fff !important; border: 1px solid var(--os-rim) !important; border-radius: 9px !important;
  box-shadow: var(--os-lift) !important; transition: transform 120ms var(--os-ease) !important; }
.btn-cancel:active:not(:disabled){ transform: translateY(1px); box-shadow: none !important; }
.ftr-pass input{ background: #fffdf8 !important; color: #1d1d1b !important; border: 1px solid #dccb9b !important;
  border-radius: 9px !important; box-shadow: var(--os-press) !important; }
.ftr-pass input:focus{ outline: none; border-color: #e3b900 !important;
  box-shadow: var(--os-press), 0 0 0 3px rgba(255,212,0,.32) !important; }

/* ═══ IN-PLACE LOADING (2026-10-05) ═══════════════════════════════════════════
   The old loading screen covered the whole window with a blurred veil and a
   spinner card. Reported from use: "still feels like a sticker" — anything laid
   OVER the content reads as pasted on, however well it is drawn. So the veil is
   gone and the work shows where it happens: a thin bar sweeps the top edge, the
   button you pressed spins, a one-line message sits at the top of the area the
   result will land in, and that area fades slightly while it works.
   ⚠ The window's own show/hide calls are UNCHANGED — a small observer watches
   the old overlay element's class and drives this instead, so no code path that
   opens or closes the loader could be missed. Same block in every window. */
#pxOverlay{ display:none !important; }
.wk-bar{ position:fixed; top:0; left:0; right:0; height:3px; z-index:9999; overflow:hidden;
  opacity:0; transition:opacity 180ms ease; pointer-events:none; }
.wk-bar::before{ content:''; position:absolute; top:0; bottom:0; width:38%; left:-38%;
  background:linear-gradient(90deg, rgba(255,207,0,0), #ffcf00 40%, #ffe45c 60%, rgba(255,207,0,0));
  animation: wk-sweep 1.15s cubic-bezier(.37,0,.63,1) infinite; }
@keyframes wk-sweep{ to{ left:100%; } }
body.wk-on .wk-bar{ opacity:1; }
.wk-line{ display:flex; align-items:center; gap:9px; padding:9px 4px 10px; margin:0 0 6px;
  font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
  color:#6b5a2a; border-bottom:1px dashed #e6d9b3; animation: wk-in 220ms ease both; }
.wk-line::before{ content:''; width:12px; height:12px; flex-shrink:0; border-radius:50%;
  border:2px solid #f1e3a8; border-top-color:#e3b900; animation: wk-spin .7s linear infinite; }
.wk-line .wk-sub{ font-family:'Roboto',sans-serif; text-transform:none; letter-spacing:0; font-size:12px; color:#8a7a4a; }
@keyframes wk-spin{ to{ transform:rotate(360deg); } }
@keyframes wk-in{ from{ opacity:0; transform:translateY(-3px); } to{ opacity:1; transform:none; } }
body.wk-on #bodyEl > :not(.wk-line){ pointer-events:none; filter: opacity(.42) saturate(.6);
  transition: filter 220ms ease; }  /* filter, not opacity: os-rise holds opacity via fill-mode */
button.wk-btn{ position:relative; }
button.wk-btn::after{ content:''; display:inline-block; width:10px; height:10px; margin-left:8px; vertical-align:-1px;
  border-radius:50%; border:2px solid rgba(29,29,27,.25); border-top-color:#1d1d1b; animation: wk-spin .7s linear infinite; }
@media (prefers-reduced-motion: reduce){ .wk-bar::before, .wk-line::before, button.wk-btn::after{ animation-duration: 2.4s; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hdr" id="hdrEl"></div>
    <div class="body" id="bodyEl"></div>
    <div class="ftr" id="ftrEl">
      <label class="ftr-pass">Passphrase
        <input type="password" id="passEl" autocomplete="off" oninput="updateSummary()" onkeydown="if(event.key==='Enter')onApply()">
      </label>
      <span class="ftr-summary" id="summaryEl">Loading…</span>
      <div class="ftr-btns">
        <button class="btn-cancel" id="btnCancel" onclick="onCancel()">Cancel</button>
        <button class="btn-apply"  id="btnApply"  onclick="onApply()">Push to Zoho</button>
      </div>
    </div>
    <div class="status" id="statusBar"></div>
  </div>

  <!-- LOADING OVERLAY — shown while applyPricePush runs (synchronous n8n write) -->
  <div class="px-overlay" id="pxOverlay">
    <div class="px-spinner"><span class="px-spinner-dot"></span></div>
    <div class="px-overlay-msg" id="pxOverlayMsg">Writing to Zoho</div>
    <div class="px-overlay-sub">This can take up to a minute — please don't close this window</div>
  </div>

  <script>
    // Server-injected payload (force-unescaped — it's a JSON string; HTML
    // escaping would corrupt the quotes; </ was pre-escaped server-side).
    var DATA = <?!= dataJson ?>;

    var state = {};   // keyed by sku for pushable rows: { checked: bool }

    initState();
    renderHeader();
    renderLines();
    updateSummary();

    function initState() {
      DATA.candidates.forEach(function(c) {
        if (c.pushable) state[c.sku] = { checked: true };
      });
    }

    function renderHeader() {
      var m = DATA.meta || {};
      var bits = [];
      bits.push('<span class="chip-summary">' + m.pushable + ' ready</span>');
      if (m.skipped > 0) bits.push('<span class="chip-summary">' + m.skipped + ' skipped</span>');
      var synced = m.zohoSyncedAt ? 'Zoho synced ' + agoStr(m.zohoSyncedAt) : '';

      var warn = '';
      if (!m.hasPassphrase) {
        warn = '<div class="hdr-warn">⚠ No passphrase configured on the server — run <b>setPricePushPassphrase</b> from the editor before pushing.</div>';
      }

      document.getElementById('hdrEl').innerHTML =
          '<div class="hdr-row1">'
        +   '<span class="hdr-title">Push Prices → Zoho</span>'
        +   '<span class="hdr-sub">writes selling + cost = eBay price</span>'
        + '</div>'
        + '<div class="hdr-row2">' + bits.join(' ')
        + (synced ? '  <span style="color:#888;">· ' + esc(synced) + '</span>' : '') + '</div>'
        + warn;
    }

    function renderLines() {
      var html = '';
      DATA.candidates.forEach(function(c) { html += renderLine(c); });
      document.getElementById('bodyEl').innerHTML = html;
    }

    function renderLine(c) {
      if (!c.pushable) {
        return ''
          + '<div class="line skip">'
          +   '<div class="line-cb"><span class="locked">SKIP</span></div>'
          +   '<div class="line-main">'
          +     '<div class="line-row1"><span class="line-sku">' + esc(c.sku) + '</span>'
          +       '<span class="line-name">' + esc(c.name || '') + '</span></div>'
          +     '<div class="line-row2"><span class="skip-reason">' + esc(c.skipReason || 'skipped') + '</span></div>'
          +   '</div>'
          +   '<div class="line-chips"><span class="chip skip">SKIP</span></div>'
          + '</div>';
      }

      var s = state[c.sku];
      var cls = ['line', c.direction === 'ZOHO HIGH' ? 'high' : 'low'];
      if (c.bigSwing) cls.push('swing');
      if (s && !s.checked) cls.push('unchecked');

      var checkedAttr = (s && s.checked) ? 'checked' : '';
      var cb = '<input type="checkbox" ' + checkedAttr + ' onchange="onToggle(\'' + escAttr(c.sku) + '\')">';

      var deltaStr = '';
      if (c.delta != null) {
        deltaStr = '<span class="price-delta">(' + (c.delta > 0 ? '+' : '') + fmt(c.delta) + ')</span>';
      }
      var prices =
          '<span class="price-before">Zoho ' + fmt(c.zohoBefore) + '</span>'
        + '<span class="price-arrow">→</span>'
        + '<span class="price-after">eBay ' + fmt(c.ebayTarget) + '</span>'
        + deltaStr;

      var chips = '<span class="chip ' + (c.direction === 'ZOHO HIGH' ? 'high' : 'low') + '">'
                + esc(c.direction) + '</span>';
      if (c.bigSwing) chips += '<span class="chip swing">BIG CHANGE</span>';

      return ''
        + '<div class="line ' + cls.join(' ') + '" id="line-' + escAttr(c.sku) + '">'
        +   '<div class="line-cb">' + cb + '</div>'
        +   '<div class="line-main">'
        +     '<div class="line-row1"><span class="line-sku">' + esc(c.sku) + '</span>'
        +       '<span class="line-name">' + esc(c.name || '') + '</span></div>'
        +     '<div class="line-row2">' + prices + '</div>'
        +   '</div>'
        +   '<div class="line-chips">' + chips + '</div>'
        + '</div>';
    }

    function onToggle(sku) {
      if (!state[sku]) return;
      state[sku].checked = !state[sku].checked;
      var el = document.getElementById('line-' + sku);
      if (el) { state[sku].checked ? el.classList.remove('unchecked') : el.classList.add('unchecked'); }
      updateSummary();
    }

    function checkedCount() {
      var n = 0;
      Object.keys(state).forEach(function(sku) { if (state[sku].checked) n++; });
      return n;
    }

    function updateSummary() {
      var n = checkedCount();
      var total = DATA.meta.pushable;
      var pass = document.getElementById('passEl').value;
      document.getElementById('summaryEl').textContent = n + ' of ' + total + ' selected to push';
      document.getElementById('summaryEl').className = (n === 0) ? 'ftr-summary warn' : 'ftr-summary';
      document.getElementById('btnApply').disabled = (n === 0 || !pass);
    }

    var busy = false;
    function onApply() {
      if (busy) return;
      var pass = document.getElementById('passEl').value;
      if (!pass) { showStatus('Enter the passphrase', true); return; }

      var checked = [];
      Object.keys(state).forEach(function(sku) { if (state[sku].checked) checked.push(sku); });
      if (checked.length === 0) { showStatus('Nothing selected', true); return; }

      if (!confirm('Push ' + checked.length + ' price(s) to Zoho?\nSets selling + cost = eBay price. This writes to Zoho.')) return;

      busy = true;
      document.getElementById('btnApply').disabled = true;
      document.getElementById('btnCancel').disabled = true;
      showStatus('Writing ' + checked.length + ' price(s) to Zoho…');
      showOverlay('Writing ' + checked.length + ' price(s) to Zoho');

      google.script.run
        .withSuccessHandler(onApplyOk)
        .withFailureHandler(onApplyFail)
        .applyPricePush(DATA.sessionId, checked, pass);
    }

    function onApplyOk(res) {
      busy = false;
      hideOverlay();
      if (!res || !res.ok) {
        document.getElementById('btnApply').disabled = false;
        document.getElementById('btnCancel').disabled = false;
        showStatus('✗ ' + (res && res.reason ? res.reason : 'Push failed'), true);
        return;
      }
      renderDone(res);
    }

    function onApplyFail(err) {
      busy = false;
      hideOverlay();
      document.getElementById('btnApply').disabled = false;
      document.getElementById('btnCancel').disabled = false;
      showStatus('✗ Server error: ' + (err && err.message ? err.message : err), true);
    }

    function onCancel() { if (!busy) google.script.host.close(); }

    function renderDone(res) {
      var results = res.results || [];
      var rowsHtml = results.map(function(r) {
        if (r.ok) {
          return '<div class="report-row">'
               + '<span class="report-sku">' + esc(r.sku) + '</span>'
               + '<span>✓ ' + fmt(r.before) + ' → ' + fmt(r.after) + '</span></div>';
        }
        return '<div class="report-row fail">'
             + '<span class="report-sku">' + esc(r.sku) + '</span>'
             + '<span class="report-detail err">✗ ' + esc(r.error || 'failed') + '</span></div>';
      }).join('');

      var icon = (res.failed > 0) ? '⚠' : '✓';
      document.getElementById('bodyEl').innerHTML =
          '<div class="done">'
        +   '<div class="done-head">'
        +     '<div class="done-icon">' + icon + '</div>'
        +     '<div class="done-title">Push Complete</div>'
        +     '<div class="done-sub">' + res.pushed + ' pushed · ' + res.failed + ' failed</div>'
        +   '</div>'
        +   rowsHtml
        + '</div>';

      document.getElementById('ftrEl').innerHTML =
          '<span class="ftr-summary">Re-run the audit to confirm — pushed rows drop off the list.</span>'
        + '<div class="ftr-btns"><button class="btn-apply" onclick="google.script.host.close()">Close</button></div>';
    }

    var _statusT;
    function showStatus(msg, isError) {
      var el = document.getElementById('statusBar');
      el.textContent = msg;
      el.className = 'status shown' + (isError ? ' error' : '');
      clearTimeout(_statusT);
      _statusT = setTimeout(function() { el.classList.remove('shown'); }, isError ? 4500 : 2200);
    }

    function showOverlay(msg) {
      document.getElementById('pxOverlayMsg').textContent = (msg || 'Working');
      document.getElementById('pxOverlay').classList.add('shown');
    }
    function hideOverlay() {
      document.getElementById('pxOverlay').classList.remove('shown');
    }

    function fmt(n) {
      if (n == null || n === '' || isNaN(Number(n))) return '—';
      return '$' + Number(n).toFixed(2);
    }
    function agoStr(ms) {
      var mins = Math.round((Date.now() - ms) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + ' min ago';
      var h = Math.floor(mins / 60); var mm = mins % 60;
      return h + 'h ' + mm + 'm ago';
    }
    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }
  </script>

<script>
/* IN-PLACE LOADING (2026-10-05) — see the CSS block of the same name. Watches the
   old overlay's class ('shown' or 'on') and turns it into the in-place treatment. */
(function () {
  var ov = document.getElementById('pxOverlay');
  var msgEl = document.getElementById('pxOverlayMsg');
  var REG = '#bodyEl';
  if (!ov) return;
  var bar = document.createElement('div'); bar.className = 'wk-bar'; document.body.appendChild(bar);
  var lastBtn = null, lastAt = 0, line = null, btn = null;
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (b) { lastBtn = b; lastAt = Date.now(); }
  }, true);
  function on() {
    var region = document.querySelector(REG);
    var txt = (msgEl && msgEl.textContent || 'Working').replace(/[.\u2026\s]+$/, '');
    var subEl = ov.querySelector('[class*="sub"]');
    document.body.classList.add('wk-on');
    if (region) {
      if (!line || line.parentNode !== region) {
        if (line && line.parentNode) line.parentNode.removeChild(line);
        line = document.createElement('div'); line.className = 'wk-line';
        region.insertBefore(line, region.firstChild);
      }
      line.innerHTML = '';
      line.appendChild(document.createTextNode(txt + '\u2026'));
      if (subEl && subEl.textContent) {
        var s = document.createElement('span'); s.className = 'wk-sub'; s.textContent = '\u00b7 ' + subEl.textContent;
        line.appendChild(s);
      }
      region.scrollTop = 0;
    }
    if (lastBtn && Date.now() - lastAt < 1500 && document.body.contains(lastBtn)) {
      btn = lastBtn; btn.classList.add('wk-btn');
    }
  }
  function off() {
    document.body.classList.remove('wk-on');
    if (line && line.parentNode) line.parentNode.removeChild(line);
    line = null;
    if (btn) { btn.classList.remove('wk-btn'); btn = null; }
  }
  function sync() {
    var shown = ov.classList.contains('shown') || ov.classList.contains('on');
    shown ? on() : off();
  }
  new MutationObserver(sync).observe(ov, { attributes: true, attributeFilter: ['class'] });
  if (msgEl) new MutationObserver(function () { if (document.body.classList.contains('wk-on')) on(); })
    .observe(msgEl, { childList: true, characterData: true, subtree: true });
  sync();
})();
</script>
</body>
</html>
