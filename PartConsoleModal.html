<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  /* Part / SKU console — one window that knows everything about a part.
     Brand-aligned (cream paper, brand yellow, Oswald/Roboto Mono). Scoped .pc-*.
     Top = images + facts; then the kit view (if it's a kit) + the ripple
     (which kits use it). In-window search like the Order Case console. */
  * { box-sizing: border-box; }
  body { margin:0; background:#fff8e7; color:#1d1d1b; font-family:'Roboto',Arial,sans-serif; font-size:13px; }
  .pc-wrap { display:flex; flex-direction:column; height:100vh; }

  .pc-head { background:#1d1d1b; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .pc-head h1 { margin:0; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; letter-spacing:.05em; color:#ffd400; white-space:nowrap; }
  .pc-searchwrap { display:flex; gap:6px; flex:1; min-width:220px; align-items:stretch; }
  #pcSearch { flex:1; resize:none; height:34px; max-height:110px; overflow-y:auto; line-height:18px; padding:7px 10px; border:1px solid #4a4a46; border-radius:6px; background:#2a2a27; color:#fff; font-family:'Roboto Mono',monospace; font-size:13px; }
  #pcSearch::placeholder { color:#8a8a84; }
  .pc-searchbtn { padding:7px 14px; border:none; border-radius:6px; cursor:pointer; background:#ffd400; color:#1d1d1b; font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:12px; white-space:nowrap; }
  .pc-searchbtn:disabled { opacity:.5; cursor:default; }

  .pc-context { background:#2a2a27; color:#eee; padding:7px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:34px; }
  .pc-ctx-sku { font-family:'Roboto Mono',monospace; font-weight:700; font-size:14px; color:#fff; }
  .pc-ctx-title { color:#cfcfca; font-size:12px; }
  .pc-badge { font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:2px 8px; border-radius:10px; background:#444; color:#ffd966; }
  .pc-badge.kit { background:#5a3d91; color:#fff; }
  .pc-badge.oos { background:#b71c1c; color:#fff; }
  .pc-badge.active { background:#1b5e20; color:#c8e6c9; }
  .pc-badge.ended { background:#555; color:#ddd; }
  .pc-links { margin-left:auto; display:flex; gap:8px; }
  .pc-jump { display:inline-flex; align-items:center; gap:5px; text-decoration:none; background:#ffd400; color:#1d1d1b; font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:11px; padding:5px 11px; border-radius:6px; }

  .pc-main { flex:1; display:flex; min-height:0; }
  .pc-body { flex:1; overflow-y:auto; padding:16px 18px; min-width:0; }

  /* ── PARTS FINDER: the result list (2026-10-01) ─────────────────────────── */
  .pf-mode { background:#1d1d1b; color:#9a9a90; padding:0 18px 9px; font-size:11.5px; display:none; gap:6px; align-items:center; flex-wrap:wrap; }
  .pf-mode.on { display:flex; }
  .pf-mode b { color:#ffd966; font-family:'Oswald',sans-serif; letter-spacing:.04em; font-weight:500; }
  .pf-mode a { color:#cfcfca; cursor:pointer; text-decoration:underline; text-decoration-color:rgba(255,255,255,.3); }
  .pf-mode a:hover { color:#ffd400; }
  .pf-mode .pf-note { color:#ffb74d; margin-left:6px; }
  .pf-mode .pf-ms { margin-left:auto; }
  .pf-list { width:440px; flex-shrink:0; border-right:1px solid #e5ddc7; background:#fffdf6; overflow-y:auto; display:none; }
  .pf-list.on { display:block; }
  .pf-sum { padding:9px 12px; font-size:12px; color:#5f5f5f; border-bottom:1px solid #efe5c8; display:flex; gap:10px; align-items:center; position:sticky; top:0; background:#fffdf6; z-index:2; }
  .pf-sum .ok { color:#1b5e20; } .pf-sum .no { color:#b71c1c; }
  .pf-copy { margin-left:auto; border:none; border-radius:5px; background:#1d1d1b; color:#ffd966; font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; padding:4px 9px; cursor:pointer; }
  .pf-q { font-family:'Roboto Mono',monospace; font-weight:700; font-size:12.5px; padding:8px 12px 4px; color:#1d1d1b; display:flex; gap:8px; align-items:baseline; }
  .pf-q span { font-family:'Oswald',sans-serif; font-weight:400; font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:#9a9a90; }
  .pf-item { display:flex; gap:10px; padding:8px 12px; cursor:pointer; border-left:3px solid transparent; }
  .pf-item:hover { background:#fdf3d6; }
  .pf-item.sel { background:#fff4b0; border-left-color:#ffd400; }
  .pf-item.kit { border-left-color:#c9b8e8; }
  .pf-item.kit.sel { border-left-color:#ffd400; }
  .pf-thumb { width:52px; height:52px; flex-shrink:0; border:1px solid #e5ddc7; border-radius:6px; background:#fff center/contain no-repeat; }
  .pf-thumb.none { display:flex; align-items:center; justify-content:center; color:#cdba7f; font-size:9px; font-family:'Oswald',sans-serif; letter-spacing:.05em; }
  .pf-info { min-width:0; flex:1; }
  .pf-line1 { display:flex; gap:6px; align-items:center; }
  .pf-sku { font-family:'Roboto Mono',monospace; font-weight:700; font-size:13px; }
  .pf-title { font-size:12px; color:#3a3a36; line-height:1.35; margin-top:2px;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pf-meta { display:flex; gap:10px; margin-top:4px; font-size:11.5px; color:#5f5f5f; align-items:baseline; }
  .pf-meta .loc { font-family:'Roboto Mono',monospace; font-weight:700; color:#1d1d1b; }
  .pf-meta .loc.nf { color:#b06a00; font-weight:400; }
  .pf-meta .qty { font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; color:#1b5e20; }
  .pf-meta .qty.zero { color:#b71c1c; }
  .pf-meta .price { font-family:'Roboto Mono',monospace; margin-left:auto; color:#1d1d1b; }
  .pf-tag { font-family:'Oswald',sans-serif; font-size:9.5px; letter-spacing:.04em; text-transform:uppercase; padding:1px 6px; border-radius:8px; background:#eee7cf; color:#6b5d2e; white-space:nowrap; }
  .pf-tag.kit { background:#5a3d91; color:#fff; }
  .pf-tag.extra { background:#fff0b3; color:#6b5200; }
  .pf-tag.ended { background:#e0e0e0; color:#555; }
  .pf-missing { margin:10px 12px; padding:9px 10px; border:1px dashed #d9c58a; border-radius:8px; background:#fff; font-size:11.5px; color:#8a5a00; }
  .pf-missing b { font-family:'Oswald',sans-serif; letter-spacing:.05em; text-transform:uppercase; font-weight:500; font-size:11px; }
  .pf-missing span { display:inline-block; font-family:'Roboto Mono',monospace; background:#fdf6df; color:#1d1d1b; border-radius:4px; padding:1px 6px; margin:3px 4px 0 0; }
  .pf-more { color:#8a8a80; font-size:11px; text-align:center; padding:10px; }
  .pf-hint { color:#8a8a80; line-height:1.8; padding:40px 30px; text-align:center; }
  .pc-loading { color:#9a9a90; font-style:italic; padding:8px 0; }

  /* top: images + facts */
  .pc-top { display:flex; gap:16px; flex-wrap:wrap; }
  .pc-images { width:240px; flex-shrink:0; }
  .pc-mainimg { width:240px; height:240px; border:1px solid #e5ddc7; border-radius:10px; background:#fff; object-fit:contain; display:block; }
  .pc-noimg { width:240px; height:240px; border:1px dashed #cdba7f; border-radius:10px; background:#fffdf6; display:flex; align-items:center; justify-content:center; color:#b6a875; font-family:'Oswald',sans-serif; letter-spacing:.05em; font-size:12px; text-align:center; }
  .pc-thumbs { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .pc-thumb { width:44px; height:44px; border:1px solid #e5ddc7; border-radius:6px; object-fit:cover; cursor:pointer; background:#fff; }
  .pc-thumb.sel { border:2px solid #ffd400; }

  .pc-facts { flex:1; min-width:280px; display:flex; flex-wrap:wrap; gap:12px; align-content:flex-start; }
  .pc-card { background:#fff; border:1px solid #e5ddc7; border-radius:10px; padding:12px 14px; min-width:150px; flex:1; }
  .pc-card-label { font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:10px; color:#8a8a80; margin-bottom:5px; }
  .pc-big { font-family:'Oswald',sans-serif; font-weight:700; font-size:30px; line-height:1; }
  .pc-big.oos { color:#b71c1c; }
  .pc-big.ok { color:#1b5e20; }
  .pc-sub { font-size:11px; color:#5f5f5f; margin-top:4px; }
  .pc-money { font-family:'Roboto Mono',monospace; font-weight:700; font-size:20px; }
  .pc-drift { font-size:11px; margin-top:3px; }
  .pc-drift.low { color:#7a3d00; }
  .pc-drift.high { color:#b71c1c; }
  .pc-loc { font-family:'Roboto Mono',monospace; font-weight:700; font-size:22px; }
  .pc-loc.nf { color:#b06a00; font-size:15px; }

  /* section headings */
  .pc-sec { font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:#5f5f5f; margin:20px 0 8px; border-bottom:1px solid #e5ddc7; padding-bottom:5px; display:flex; align-items:center; gap:8px; }
  .pc-sec .pc-count { color:#9a9a90; font-weight:normal; }

  /* insight banner */
  .pc-insight { background:#e8f5e9; border:1px solid #a5d6a7; color:#1b5e20; border-radius:8px; padding:9px 12px; margin:8px 0; font-size:13px; }
  .pc-insight b { font-family:'Oswald',sans-serif; }

  /* tables (kit components + ripple) */
  table.pc-tbl { width:100%; border-collapse:collapse; font-size:12.5px; background:#fff; border:1px solid #e5ddc7; border-radius:8px; overflow:hidden; }
  .pc-tbl th { background:#1d1d1b; color:#ffd966; font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.03em; font-size:10px; padding:6px 9px; text-align:left; }
  .pc-tbl td { padding:6px 9px; border-bottom:1px solid #eee4c8; }
  .pc-tbl tr:last-child td { border-bottom:none; }
  .pc-tbl tr.blocked td { background:#fff0f0; }
  .pc-mono { font-family:'Roboto Mono',monospace; }
  /* clickable SKU → surf to that part/kit in the same window */
  .pc-link { color:#0a6ebd; cursor:pointer; text-decoration:underline; text-decoration-color:rgba(10,110,189,.45); }
  .pc-link:hover { color:#083f6b; background:#eaf3fb; border-radius:3px; }
  .pc-pill { font-family:'Oswald',sans-serif; font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; padding:1px 6px; border-radius:8px; }
  .pc-pill.build { background:#c8e6c9; color:#1b5e20; }
  .pc-pill.zero { background:#ffcdd2; color:#b71c1c; }
  .pc-pill.warn { background:#fff3b0; color:#7a5c00; }
  .pc-pill.blocked { background:#b71c1c; color:#fff; }
  .pc-pill.UNDERPRICED { background:#ffcdd2; color:#b71c1c; }
  .pc-pill.OVERPRICED { background:#ffd699; color:#7a3d00; }
  .pc-pill.status { background:#eee; color:#555; }

  .pc-kitprice { display:flex; gap:20px; flex-wrap:wrap; margin:8px 0; }
  .pc-kitprice > div { }
  .pc-kitprice .l { font-family:'Oswald',sans-serif; font-size:10px; text-transform:uppercase; color:#8a8a80; letter-spacing:.05em; }
  .pc-kitprice .v { font-family:'Roboto Mono',monospace; font-weight:700; font-size:16px; }

  .pc-empty { color:#9a9a90; font-style:italic; padding:8px 0; }

  /* identity: every number the part answers to + what it fits */
  .pc-id { background:#fff; border:1px solid #e5ddc7; border-radius:10px; padding:10px 14px; }
  .pc-idrow { display:flex; gap:12px; padding:6px 0; border-bottom:1px solid #f1ead6; align-items:flex-start; }
  .pc-idrow:last-child { border-bottom:none; }
  .pc-idlab { font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:10px; color:#8a8a80; width:88px; flex:none; padding-top:4px; }
  .pc-chips { display:flex; flex-wrap:wrap; gap:5px; flex:1; min-width:0; }
  .pc-chip { font-family:'Roboto Mono',monospace; font-size:12px; background:#f6f1e1; border:1px solid #e5ddc7; border-radius:6px; padding:2px 7px; }
  .pc-chip.num { cursor:pointer; }
  .pc-chip.num:hover { background:#fff4b0; border-color:#e0c96a; }
  .pc-chip.main { background:#1d1d1b; color:#ffd966; border-color:#1d1d1b; }
  .pc-idgrp { flex-basis:100%; font-family:'Oswald',sans-serif; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:#9a9a90; margin-top:4px; }
  .pc-chip .via { font-family:'Oswald',sans-serif; font-size:9px; text-transform:uppercase; color:#9a9a90; margin-left:5px; letter-spacing:.04em; }
  .pc-chip.main .via { color:#bfa94d; }
  .pc-idtext { font-size:12.5px; line-height:1.5; color:#333; flex:1; min-width:0; }
  .pc-more { color:#0a6ebd; cursor:pointer; font-size:12px; white-space:nowrap; }
  .pc-idcopy { margin-left:auto; font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.05em; text-transform:uppercase; background:#fff; border:1px solid #cdba7f; color:#5f5f5f; border-radius:6px; padding:2px 8px; cursor:pointer; }
  .pc-idcopy:hover { background:#fff4b0; }

  /* loading overlay */
  .pc-overlay { display:none; position:fixed; inset:0; background:rgba(20,20,18,.55); align-items:center; justify-content:center; flex-direction:column; z-index:50; }
  .pc-overlay.on { display:flex; }
  .pc-spin { width:40px; height:40px; border:4px solid #ffd400; border-top-color:transparent; border-radius:50%; animation:pcspin .8s linear infinite; }
  @keyframes pcspin { to { transform:rotate(360deg); } }
  .pc-overlay-txt { color:#ffd400; font-family:'Oswald',sans-serif; margin-top:12px; letter-spacing:.05em; }

    /* ── DRAWN MARKS (v3.6) ──────────────────────────────────────────────────
       An emoji is someone else's artwork — its weight, hue and shape decided by
       whatever font the device happens to have. This project has already watched
       a radio glyph land as tofu and a circle arrive as a yellow beach-ball on the
       real warehouse tablet. A mark is a 1.55px stroke on a 24 grid that takes the
       surrounding ink via currentColor, so it needs no per-state override.
       ⚠ SPRITE IDS MATCH Sidebar.html's sheet — same name, same drawing. Change one,
         change both, or two surfaces start disagreeing about what a symbol means. */
    .mk {
      width: 1em; height: 1em; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.55;
      stroke-linecap: round; stroke-linejoin: round;
      vertical-align: -0.14em; margin-right: 0.42em;
    }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="m-part" viewBox="0 0 24 24"><path d="M12 3.4 19.4 7.7v8.6L12 20.6 4.6 16.3V7.7z"/><circle cx="12" cy="12" r="3.4"/></symbol>
    <symbol id="m-look" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
    <symbol id="m-price" viewBox="0 0 24 24"><path d="M12.6 3.5H20v7.4l-9 9-7.4-7.5z"/><circle cx="16.6" cy="7.3" r="1.5"/></symbol>
    <symbol id="m-loc" viewBox="0 0 24 24"><path d="M12 21s6.5-6.1 6.5-10.6A6.5 6.5 0 0 0 5.5 10.4C5.5 14.9 12 21 12 21z"/><circle cx="12" cy="10.3" r="2.3"/></symbol>
    <symbol id="m-doc" viewBox="0 0 24 24"><path d="M6.2 3.6h7.4L18 8v12.4H6.2z"/><path d="M13.6 3.6V8H18"/><path d="M9 12.6h6M9 16h4.2"/></symbol>
    <symbol id="m-kit" viewBox="0 0 24 24"><path d="M12 3.2 20.5 8v8L12 20.8 3.5 16V8z"/><path d="M3.5 8 12 12.6 20.5 8M12 12.6V20.8"/></symbol>
    <symbol id="m-bolt" viewBox="0 0 24 24"><path d="M13.4 2.6 5.2 13.6h5.6l-.9 7.8 8.2-11h-5.6z"/></symbol>
  </defs></svg>
  <div class="pc-wrap">
    <div class="pc-head">
      <h1><svg class="mk"><use href="#m-part"/></svg>PARTS FINDER</h1>
      <button class="pc-searchbtn" id="pcBack" onclick="goBack()" title="Back to the previous SKU"
              style="display:none;background:#3a3a34;color:#ffd400;">← Back</button>
      <div class="pc-searchwrap">
        <textarea id="pcSearch" rows="1" placeholder="SKU · part numbers (paste the SERPIC list) · or words: v2203 piston" autocomplete="off" spellcheck="false"></textarea>
        <button class="pc-searchbtn" id="pcSearchBtn" onclick="doSearch()"><svg class="mk"><use href="#m-look"/></svg>Find</button>
      </div>
    </div>

    <div class="pf-mode" id="pfMode"></div>
    <div class="pc-context" id="pcContext"></div>

    <div class="pc-main">
    <aside class="pf-list" id="pfList"></aside>
    <div class="pc-body">
      <div class="pc-top">
        <div class="pc-images" id="pcImages"></div>
        <div class="pc-facts" id="pcFacts"></div>
      </div>
      <div id="pcIdentity"></div>
      <div id="pcKit"></div>
      <div id="pcRipple"></div>
    </div>
    </div>
  </div>

  <div class="pc-overlay" id="pcOverlay">
    <div class="pc-spin"></div>
    <div class="pc-overlay-txt" id="pcOverlayTxt">Loading…</div>
  </div>

  <script>
    var INIT = <?!= initJson ?>;   // force-unescaped JSON (Gotcha 2)
    var current = null;

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function money(n){ return (n==null||isNaN(n)) ? '—' : '$' + Number(n).toFixed(2); }
    function num(n){ return (n==null||n==='') ? '—' : n; }

    function renderImages(part) {
      var host = document.getElementById('pcImages');
      var imgs = (part && part.images) || [];
      if (!imgs.length) { host.innerHTML = '<div class="pc-noimg">no image<br/>on file</div>'; return; }
      var main = '<img class="pc-mainimg" id="pcMainImg" src="' + esc(imgs[0]) + '" '
               + 'onerror="this.style.display=\'none\';this.insertAdjacentHTML(\'afterend\',\'<div class=\\\'pc-noimg\\\'>image<br/>unavailable</div>\');" '
               + 'alt="item image" />';
      var thumbs = '';
      if (imgs.length > 1) {
        thumbs = '<div class="pc-thumbs">' + imgs.map(function(u,i){
          return '<img class="pc-thumb' + (i===0?' sel':'') + '" src="' + esc(u) + '" '
               + 'onclick="swapImg(this,\'' + esc(u).replace(/'/g,"\\'") + '\')" '
               + 'onerror="this.style.display=\'none\';" />';
        }).join('') + '</div>';
      }
      host.innerHTML = main + thumbs;
    }
    function swapImg(el, url) {
      var m = document.getElementById('pcMainImg'); if (m){ m.src = url; m.style.display='block'; }
      var t = document.querySelectorAll('.pc-thumb'); for (var i=0;i<t.length;i++) t[i].classList.remove('sel');
      el.classList.add('sel');
    }

    function renderFacts(part) {
      var host = document.getElementById('pcFacts');
      if (!part || part.available == null && part.ebayPrice == null && !part.title) {
        host.innerHTML = '<div class="pc-empty">Not in Master Inventory / Zoho Stock.</div>'; return;
      }
      var availCls = part.oos ? 'oos' : (part.available > 0 ? 'ok' : '');
      var srcBits = [];
      if (part.zohoAvailable != null) srcBits.push('Zoho ' + part.zohoAvailable);
      if (part.miAvailable != null)   srcBits.push('MI ' + part.miAvailable);
      var stock = '<div class="pc-card"><div class="pc-card-label">◫ On hand</div>'
        + '<div class="pc-big ' + availCls + '">' + num(part.available) + '</div>'
        + '<div class="pc-sub">' + (srcBits.join(' · ') || '—')
        + (part.sold != null ? ' · ' + part.sold + ' sold' : '') + '</div></div>';

      // price + drift
      var drift = '';
      if (part.ebayPrice != null && part.zohoPrice != null) {
        var d = part.zohoPrice - part.ebayPrice;
        if (Math.abs(d) >= 1) drift = '<div class="pc-drift ' + (d>0?'high':'low') + '">Zoho ' + (d>0?'+':'') + money(d) + ' vs eBay</div>';
      }
      var price = '<div class="pc-card"><div class="pc-card-label"><svg class="mk"><use href="#m-price"/></svg>Price</div>'
        + '<div class="pc-money">' + money(part.ebayPrice) + '</div>'
        + '<div class="pc-sub">eBay' + (part.zohoPrice!=null?' · Zoho ' + money(part.zohoPrice):'') + '</div>'
        + drift + '</div>';

      var locCls = (part.location === 'NOT FOUND') ? 'nf' : '';
      var where = '<div class="pc-card"><div class="pc-card-label"><svg class="mk"><use href="#m-loc"/></svg>Location</div>'
        + '<div class="pc-loc ' + locCls + '">' + esc(part.location || '—') + '</div>'
        + '<div class="pc-sub">' + (part.listingStatus ? esc(part.listingStatus) : '') + '</div></div>';

      var demand = '<div class="pc-card"><div class="pc-card-label"><svg class="mk"><use href="#m-doc"/></svg>Open demand</div>'
        + '<div class="pc-big">' + (part.committed == null ? '…' : part.committed) + '</div>'
        + '<div class="pc-sub">committed to open orders</div></div>';

      host.innerHTML = stock + price + where + demand;
    }

    /** Every number this part answers to, and what it fits. Click a number → search it. */
    function renderIdentity(D) {
      var host = document.getElementById('pcIdentity');
      if (D._loading) { host.innerHTML = ''; return; }
      var id = D.identity;
      if (!id || (!id.numbers.length && !id.engines.length && !id.brands.length && !id.machines.length)) { host.innerHTML = ''; return; }
      var html = '<div class="pc-sec"><svg class="mk"><use href="#m-doc"/></svg>Part numbers &amp; fit'
        + '<button class="pc-idcopy" onclick="copyIdentity()" title="Copy the numbers and what it fits">Copy</button></div><div class="pc-id">';
      if (id.numbers.length) {
        // grouped by the column they came from — one label per group, not per chip
        var groups = [];
        id.numbers.forEach(function (n) {
          var g = groups[groups.length - 1];
          if (!g || g.via !== n.via) groups.push(g = { via: n.via, nums: [] });
          g.nums.push(n);
        });
        html += '<div class="pc-idrow"><div class="pc-idlab">Numbers <span class="pc-count">' + id.numbers.length + '</span></div><div class="pc-chips">'
          + groups.map(function (g) {
              return (g.via ? '<span class="pc-idgrp">' + esc(g.via) + '</span>' : '') + g.nums.map(function (n) {
                var tip = n.main ? 'The main MPN — the only number eBay\'s own search matches. Click to find every listing with it.'
                                 : 'Click to find every listing that carries this number';
                return '<span class="pc-chip num' + (n.main ? ' main' : '') + '" title="' + esc(tip) + '" onclick="searchNumber(\'' + esc(n.num).replace(/'/g, "\\'") + '\')">' + esc(n.num) + '</span>';
              }).join('');
            }).join('') + '</div></div>';
      }
      if (id.engines.length) html += '<div class="pc-idrow"><div class="pc-idlab">Engines</div><div class="pc-chips">'
        + id.engines.map(function (e) { return '<span class="pc-chip">' + esc(e) + '</span>'; }).join('') + '</div></div>';
      if (id.brands.length) html += '<div class="pc-idrow"><div class="pc-idlab">Makes</div><div class="pc-idtext">' + esc(id.brands.join(', ')) + '</div></div>';
      if (id.machines.length) {
        var SHOW = 10, few = id.machines.slice(0, SHOW).join(', '), rest = id.machines.length - SHOW;
        html += '<div class="pc-idrow"><div class="pc-idlab">Machines <span class="pc-count">' + id.machines.length + '</span></div><div class="pc-idtext" id="pcMach">'
          + esc(few) + (rest > 0 ? ' <span class="pc-more" onclick="showAllMachines()">+' + rest + ' more</span>' : '') + '</div></div>';
      }
      host.innerHTML = html + '</div>';
    }
    function showAllMachines() {
      var el = document.getElementById('pcMach');
      if (el && current && current.identity) el.textContent = current.identity.machines.join(', ');
    }
    /** A number from the part → a part-number search (finds every listing sharing it). */
    function searchNumber(num) {
      var box = document.getElementById('pcSearch'); box.value = num; grow(); doSearch('mpn');
    }
    function copyIdentity() {
      if (!current || !current.identity) return;
      var id = current.identity, p = current.part || {}, L = [];
      L.push(current.sku + (p.title ? ' — ' + p.title : ''));
      if (id.numbers.length) L.push('Part numbers: ' + id.numbers.map(function (n) { return n.num; }).join(', '));
      if (id.engines.length) L.push('Fits engines: ' + id.engines.join(', '));
      if (id.brands.length) L.push('Makes: ' + id.brands.join(', '));
      if (id.machines.length) L.push('Machines: ' + id.machines.join(', '));
      var text = L.join('\n');
      var done = function () { var b = document.querySelector('.pc-idcopy'); if (b) { b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy'; }, 1400); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
      else { fallbackCopy(text); done(); }
    }
    function fallbackCopy(text) {
      var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t);
    }

    function renderKit(D) {
      var host = document.getElementById('pcKit');
      if (!D.isKit || !D.kit) { host.innerHTML = ''; return; }
      var k = D.kit;
      var html = '<div class="pc-sec"><svg class="mk"><use href="#m-kit"/></svg>This SKU is a KIT <span class="pc-count">· ' + esc(k.type) + (k.engine?' · '+esc(k.engine):'') + '</span></div>';

      // price line
      var pstat = k.priceStatus ? '<span class="pc-pill ' + esc(k.priceStatus.replace(/[^A-Z]/gi,'')) + '">' + esc(k.priceStatus) + '</span>' : '';
      html += '<div class="pc-kitprice">'
        + '<div><div class="l">Parts value</div><div class="v">' + money(k.partsValue) + '</div></div>'
        + '<div><div class="l">Computed</div><div class="v">' + money(k.computed) + '</div></div>'
        + '<div><div class="l">Listed</div><div class="v">' + money(k.listed) + '</div></div>'
        + '<div><div class="l">Buildable now</div><div class="v">' + num(k.buildable) + '</div></div>'
        + (pstat ? '<div><div class="l">Kit Health</div><div class="v">' + pstat + '</div></div>' : '')
        + '</div>';
      if (!k.complete) html += '<div class="pc-insight" style="background:#fff3b0;border-color:#e0c96a;color:#7a5c00;">⚠ Incomplete — unparsed PD or unpriced parts; computed price is not trustworthy. See Kit Health.</div>';
      if (k.limitedBy) html += '<div class="pc-sub" style="margin:2px 0 8px;">Bottleneck: ' + esc(k.limitedBy) + '</div>';

      // components
      html += '<table class="pc-tbl"><tr><th>Component</th><th>Needs</th><th>Name</th><th>On hand</th></tr>';
      (k.components||[]).forEach(function(c){
        var av = c.available;
        var avCls = (av != null && av <= 0) ? 'zero' : (av>0?'build':'warn');
        html += '<tr><td class="pc-mono pc-link" onclick="nav(\'' + esc(c.sku) + '\')" title="Open this part">' + esc(c.sku) + '</td><td class="pc-mono">×' + esc(c.qty) + '</td>'
          + '<td>' + esc(c.name) + '</td><td><span class="pc-pill ' + avCls + '">' + (av==null?'?':av) + '</span></td></tr>';
      });
      html += '</table>';
      host.innerHTML = html;
    }

    function renderRipple(D) {
      var host = document.getElementById('pcRipple');
      var used = D.usedIn || [];
      if (D._loading) { host.innerHTML = '<div class="pc-loading">Loading kits, open demand and the rest…</div>'; return; }
      if (!used.length) { host.innerHTML = D.found ? '<div class="pc-sec"><svg class="mk"><use href="#m-kit"/></svg>Used in kits</div><div class="pc-empty">Not a component of any registered kit.</div>' : ''; return; }
      var html = '<div class="pc-sec"><svg class="mk"><use href="#m-kit"/></svg>Used in ' + used.length + ' kit' + (used.length===1?'':'s') + '</div>';
      if (D.unblock && D.unblock.length) {
        html += '<div class="pc-insight"><svg class="mk"><use href="#m-bolt"/></svg>Restocking this part <b>unblocks ' + D.unblock.length + ' kit' + (D.unblock.length===1?'':'s') + '</b> — ' + esc(D.unblock.join(', ')) + '</div>';
      }
      html += '<table class="pc-tbl"><tr><th>Kit</th><th>Name</th><th>Needs</th><th>Buildable</th><th>Kit Health</th></tr>';
      used.forEach(function(u){
        var bCls = (u.buildable===0)?'zero':(typeof u.buildable==='number'&&u.buildable>0?'build':'warn');
        var blockTag = u.blocked ? ' <span class="pc-pill blocked">← this part</span>' : '';
        var ps = u.priceStatus ? '<span class="pc-pill status ' + esc(u.priceStatus.replace(/[^A-Z]/gi,'')) + '">' + esc(u.priceStatus) + '</span>' : '<span style="color:#bbb;">—</span>';
        html += '<tr class="' + (u.blocked?'blocked':'') + '">'
          + '<td class="pc-mono pc-link" onclick="nav(\'' + esc(u.kitSku) + '\')" title="Open this kit">' + esc(u.kitSku) + '</td>'
          + '<td>' + esc(u.kitName) + '</td>'
          + '<td class="pc-mono">×' + esc(u.qtyPer) + '</td>'
          + '<td><span class="pc-pill ' + bCls + '">' + (typeof u.buildable==='number'?u.buildable:'⚠') + '</span>' + blockTag + '</td>'
          + '<td>' + ps + '</td></tr>';
      });
      html += '</table>';
      host.innerHTML = html;
    }

    function renderDossier(D) {
      current = D;
      // context
      var ctx = document.getElementById('pcContext');
      var html = '<span class="pc-ctx-sku">' + esc(D.sku) + '</span>';
      if (D.part && D.part.title) html += '<span class="pc-ctx-title">' + esc(D.part.title) + '</span>';
      if (D.isKit) html += '<span class="pc-badge kit">KIT</span>';
      if (D.part && D.part.oos) html += '<span class="pc-badge oos">OOS</span>';
      if (D.part && D.part.listingStatus) {
        var st = String(D.part.listingStatus);
        html += '<span class="pc-badge ' + (st.toLowerCase()==='active'?'active':'ended') + '">' + esc(st) + '</span>';
      }
      var links = '';
      if (D.ebayUrl) links = '<a class="pc-jump" href="' + esc(D.ebayUrl) + '" target="_blank" rel="noopener">↗ eBay</a>';
      html += '<span class="pc-links">' + links + '</span>';
      ctx.innerHTML = html;

      if (!D.found) {
        document.getElementById('pcImages').innerHTML = '';
        document.getElementById('pcFacts').innerHTML = '<div class="pc-empty">No part found for “' + esc(D.sku) + '”. Check the SKU, or search again above.</div>';
        document.getElementById('pcKit').innerHTML = '';
        document.getElementById('pcIdentity').innerHTML = '';
        document.getElementById('pcRipple').innerHTML = '';
      } else {
        renderImages(D.part);
        renderFacts(D.part);
        renderIdentity(D);
        renderKit(D);
        renderRipple(D);
      }
      var bk = document.getElementById('pcBack'); if (bk) bk.style.display = navHist.length ? '' : 'none';
    }

    var navHist = [];
    var wantSku = null;   // the part the right pane SHOULD show — a slow reply for an older click is dropped
    function loadPart(sku, quiet) {
      var q = String(sku || '').trim();
      if (!q) return;
      wantSku = q;
      if (!quiet) {
        document.getElementById('pcOverlayTxt').textContent = 'Looking up ' + q + '…';
        document.getElementById('pcOverlay').classList.add('on');
      }
      google.script.run
        .withSuccessHandler(function(res){
          document.getElementById('pcOverlay').classList.remove('on');
          if (wantSku !== q) return;
          if (res && res.ok) renderDossier(res.dossier);
        })
        .withFailureHandler(function(err){
          document.getElementById('pcOverlay').classList.remove('on');
          if (wantSku !== q) return;
          document.getElementById('pcRipple').innerHTML = '<div class="pc-empty">Could not load the rest: ' + esc(err && err.message ? err.message : String(err)) + '</div>';
        })
        .getPartData(q);
    }
    // surf the system in-window: nav() records history so you can jump
    // part → kit → its components → their kits, and back.
    function nav(sku) {
      if (current && current.sku && String(current.sku) !== String(sku)) navHist.push(current.sku);
      loadPart(sku);
    }
    function goBack() { if (navHist.length) loadPart(navHist.pop()); }
    // ── THE ONE BOX ──────────────────────────────────────────────────────────
    var results = null, items = [], lastText = '';
    var MODE_NAME = { sku: 'SKU', mpn: 'part numbers', keywords: 'keywords' };

    function doSearch(force) {
      var q = (document.getElementById('pcSearch').value || '').trim();
      if (!q) { document.getElementById('pcSearch').focus(); return; }
      lastText = q;
      var btn = document.getElementById('pcSearchBtn'); btn.disabled = true;
      document.getElementById('pcOverlayTxt').textContent = 'Searching…';
      document.getElementById('pcOverlay').classList.add('on');
      google.script.run
        .withSuccessHandler(function(res){
          document.getElementById('pcOverlay').classList.remove('on'); btn.disabled = false;
          showResult(res);
        })
        .withFailureHandler(function(err){
          document.getElementById('pcOverlay').classList.remove('on'); btn.disabled = false;
          showResult({ ok:false, reason: (err && err.message) || String(err) });
        })
        .findParts(q, force || '');
    }

    function paintMode(res) {
      var el = document.getElementById('pfMode');
      if (!res || !res.ok) { el.className = 'pf-mode on'; el.innerHTML = '<span class="pf-note">' + esc((res && res.reason) || 'Search failed') + '</span>'; return; }
      var others = ['sku', 'mpn', 'keywords'].filter(function (m) { return m !== res.mode; });
      el.innerHTML = 'Searched as <b>' + MODE_NAME[res.mode] + '</b>' +
        (res.auto ? ' · search as ' + others.map(function (m) {
          return '<a onclick="doSearch(\'' + m + '\')">' + MODE_NAME[m] + '</a>'; }).join(' or ') + ' instead' : '') +
        (res.note ? '<span class="pf-note">' + esc(res.note) + '</span>' : '') +
        (res.ms ? '<span class="pf-ms">' + (res.ms / 1000).toFixed(1) + 's</span>' : '');
      el.className = 'pf-mode on';
    }

    function showResult(res) {
      results = res; navHist = [];
      paintMode(res);
      var list = document.getElementById('pfList');
      if (!res || !res.ok) { list.className = 'pf-list'; return; }
      if (res.mode === 'sku') { list.className = 'pf-list'; list.innerHTML = ''; renderDossier(res.dossier); return; }

      items = [];
      var html = '';
      if (res.mode === 'mpn') {
        html += '<div class="pf-sum"><span><b>' + res.results.length + '</b> number' + (res.results.length === 1 ? '' : 's') + '</span>' +
                '<span class="ok">✓ ' + res.found + ' carried</span><span class="no">✗ ' + res.missing + ' not</span>' +
                (res.found ? '<button class="pf-copy" onclick="copyReply()">Copy for customer</button>' : '') + '</div>';
        var missing = [];
        res.results.forEach(function (x) {
          if (!x.matches.length) { missing.push(x.query); return; }
          html += '<div class="pf-q">' + esc(x.query) + '<span>' + x.matches.length + ' listing' + (x.matches.length === 1 ? '' : 's') + '</span></div>';
          x.matches.forEach(function (m) { html += itemHtml(m); });
        });
        if (missing.length) html += '<div class="pf-missing"><b>Not on any listing (' + missing.length + ')</b><br>' +
          missing.map(function (q) { return '<span>' + esc(q) + '</span>'; }).join('') + '</div>';
      } else {
        html += '<div class="pf-sum"><span><b>' + res.total + '</b> listing' + (res.total === 1 ? '' : 's') + ' with every word</span></div>';
        res.matches.forEach(function (m) { html += itemHtml(m); });
        if (res.total > res.matches.length) html += '<div class="pf-more">Best ' + res.matches.length + ' of ' + res.total + ' — add a word to narrow it.</div>';
        if (!res.total) html += '<div class="pf-hint">Nothing contains all of those words.<br>Try fewer words, or part of the model (bf4m, not bf4m1011f).</div>';
      }
      list.innerHTML = html;
      list.className = 'pf-list on';
      if (items.length) pick(0); else clearRight();
    }

    function itemHtml(m) {
      var i = items.length; items.push(m);
      var tags = '';
      if (m.isKit) tags += '<span class="pf-tag kit">kit</span>';
      if (m.via && m.via !== 'main') tags += '<span class="pf-tag extra">' + esc(m.via) + '</span>';
      if (!m.active) tags += '<span class="pf-tag ended">' + esc(m.status || 'ended') + '</span>';
      var thumb = m.image ? '<div class="pf-thumb" style="background-image:url(\'' + esc(m.image).replace(/'/g, '%27') + '\')"></div>'
                          : '<div class="pf-thumb none">NO IMAGE</div>';
      return '<div class="pf-item' + (m.isKit ? ' kit' : '') + '" id="pfi' + i + '" onclick="pick(' + i + ')">' + thumb +
        '<div class="pf-info"><div class="pf-line1"><span class="pf-sku">' + esc(m.sku) + '</span>' + tags + '</div>' +
        '<div class="pf-title">' + esc(m.title) + '</div>' +
        '<div class="pf-meta"><span class="loc' + (m.location === 'NOT FOUND' ? ' nf' : '') + '">' + esc(m.location) + '</span>' +
        '<span class="qty' + ((m.available || 0) <= 0 ? ' zero' : '') + '">' + (m.available == null ? '—' : m.available) + ' on hand</span>' +
        '<span class="price">' + money(m.price) + '</span></div></div></div>';
    }

    /** Show a list item now from what the search already returned, then fill in the rest. */
    function pick(i) {
      var m = items[i]; if (!m) return;
      var prev = document.querySelector('.pf-item.sel'); if (prev) prev.classList.remove('sel');
      var el = document.getElementById('pfi' + i); if (el) el.classList.add('sel');
      navHist = [];
      renderDossier({ sku: m.sku, found: true, isKit: m.isKit, ebayUrl: m.url, usedIn: [], _loading: true,
        part: { title: m.title, images: m.image ? [m.image] : [], location: m.location, available: m.available,
                ebayPrice: m.price, listingStatus: m.status, oos: (m.available || 0) <= 0 && m.active } });
      loadPart(m.sku, true);
    }

    function clearRight() {
      current = null; wantSku = null;
      document.getElementById('pcContext').innerHTML = '';
      document.getElementById('pcImages').innerHTML = '';
      document.getElementById('pcFacts').innerHTML = '<div class="pf-hint">Nothing to show.</div>';
      document.getElementById('pcKit').innerHTML = '';
      document.getElementById('pcRipple').innerHTML = '';
    }

    /** Plain text to send the customer: what we have, with links. */
    function copyReply() {
      if (!results || results.mode !== 'mpn') return;
      var lines = [];
      results.results.forEach(function (x) {
        var m = x.matches.filter(function (y) { return y.active; })[0] || x.matches[0];
        if (!m) return;
        lines.push(x.query + ' — ' + m.title + (m.price != null ? ' — ' + money(m.price) : '') +
                   ((m.available || 0) <= 0 ? ' (currently out of stock)' : '') + (m.url ? '\n' + m.url : ''));
      });
      var ta = document.createElement('textarea'); ta.value = lines.join('\n\n');
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      var b = document.querySelector('.pf-copy');
      if (b) { b.textContent = ok ? 'Copied ' + lines.length : 'Copy blocked'; setTimeout(function(){ b.textContent = 'Copy for customer'; }, 2000); }
    }

    // Enter searches; Shift+Enter is a new line; a pasted list grows the box.
    var box = document.getElementById('pcSearch');
    box.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSearch(); } });
    function grow() { box.style.height = '34px'; box.style.height = Math.min(110, box.scrollHeight) + 'px'; }
    box.addEventListener('input', grow);

    box.value = INIT.text || '';
    grow();
    if (INIT.res) showResult(INIT.res);
    else { clearRight(); document.getElementById('pcFacts').innerHTML =
      '<div class="pf-hint">Type a <b>SKU</b>, paste <b>part numbers</b> (the SERPIC list is fine), or type <b>words</b> like <i>v2203 piston</i>.</div>'; }
    box.focus();
  </script>
</body>
</html>
